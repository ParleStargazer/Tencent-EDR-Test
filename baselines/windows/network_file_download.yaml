schema_version: "1.1"
baseline_id: win.network.file_download
version: "0.1.0"
title: Windows 文件下载遥测
description: 同时要求 EDR 关联受控 HTTP GET 与落地文件创建；本地 URL、Actor、目标路径、大小和哈希均由 Controller 独立验证。
platform:
  os: windows
  versions: [windows-10, windows-11, windows-server-2019, windows-server-2022]
  architectures: [x64]
risk_level: L0
capability:
  id: win.network.file_download
  version: "0.1.0"
  parameters: { setup_delay_ms: 250, post_operation_hold_ms: 1500, payload_size: 8192 }
local_requirements:
  - { field: facts.network.file_download_succeeded, operator: equals, expected: true }
  - { field: facts.network.occurred_at_utc, operator: present }
  - { field: facts.network.download.file_occurred_at_utc, operator: present }
  - { field: facts.network.actor_pid, operator: present }
  - { field: facts.network.actor_executable, operator: present }
  - { field: facts.network.http.url, operator: present }
  - { field: facts.network.download.destination_path, operator: present }
  - { field: facts.network.download.md5, operator: present }
  - { field: facts.network.download.sha256, operator: present }
correlation:
  time_before_seconds: 60
  time_after_seconds: 300
  max_time_difference_ms: 15
  anchors:
    - { local_field: facts.network.actor_executable, cloud_field: process.executable, strength: strong, normalizers: [windows_path] }
    - { local_field: facts.network.actor_pid, cloud_field: process.pid, strength: medium }
cloud_expectations:
  - id: download-http-event
    event_type: network
    event_actions: [url_access]
    cardinality: { min: 1, max: 10 }
    correlation:
      time_from_local: facts.network.occurred_at_utc
      anchors:
        - { local_field: facts.network.http.url, cloud_field: url.full, strength: strong }
        - { local_field: facts.network.actor_pid, cloud_field: process.pid, strength: medium }
    assertions:
      - { field: process.pid, operator: equals, expected_from_local: facts.network.actor_pid, severity: required }
      - { field: process.executable, operator: equals, expected_from_local: facts.network.actor_executable, severity: required, normalizers: [windows_path] }
      - { field: url.full, operator: equals, expected_from_local: facts.network.http.url, severity: required }
      - { field: http.request.method, operator: equals, expected: GET, severity: recommended }
      - { field: network.destination_ip, operator: equals, expected_from_local: facts.network.remote.address, severity: required }
      - { field: network.destination_port, operator: equals, expected_from_local: facts.network.remote.port, severity: required }
  - id: downloaded-file-event
    event_type: file
    event_actions: [create]
    cardinality: { min: 1, max: 10 }
    correlation:
      time_from_local: facts.network.download.file_occurred_at_utc
      anchors:
        - { local_field: facts.network.download.destination_path, cloud_field: file.path, strength: strong, normalizers: [windows_path] }
        - { local_field: facts.network.actor_pid, cloud_field: process.pid, strength: medium }
    assertions:
      - { field: process.pid, operator: equals, expected_from_local: facts.network.actor_pid, severity: required }
      - { field: process.executable, operator: equals, expected_from_local: facts.network.actor_executable, severity: required, normalizers: [windows_path] }
      - { field: file.path, operator: equals, expected_from_local: facts.network.download.destination_path, severity: required, normalizers: [windows_path] }
      - { field: file.size, operator: equals, expected_from_local: facts.network.download.size_bytes, severity: required }
      - { field: file.hash.md5, operator: equals, expected_from_local: facts.network.download.md5, severity: recommended, normalizers: [lowercase] }
scoring: { weight: 1.0, required_field_weight: 1.0, recommended_field_weight: 0.25 }
metadata:
  owner: edr-validation-team
  status: active
  references: [Tencent EDR NetworkEvents / HttpRequest, Tencent EDR FileEvents / FileWriteClose]
