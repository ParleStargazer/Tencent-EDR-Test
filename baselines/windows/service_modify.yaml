schema_version: "1.1"
baseline_id: win.service.modify
version: "0.1.0"
title: Windows 服务修改遥测
description: 本地确认同一唯一服务的显示名、二进制标记和启动类型由手动变为禁用；云端分别检查 ChangeServiceConfig API Hook 与 Windows System 7040 两条遥测路径。
platform:
  os: windows
  versions: [windows-10, windows-11, windows-server-2019, windows-server-2022]
  architectures: [x64]
risk_level: L1
capability:
  id: win.service.modify
  version: "0.1.0"
  parameters: { setup_delay_ms: 750, post_operation_hold_ms: 1500 }
local_requirements:
  - { field: facts.service.modify_succeeded, operator: equals, expected: true }
  - { field: facts.service.native_api, operator: equals, expected: ChangeServiceConfigW }
  - { field: facts.service.name, operator: present }
  - { field: facts.service.before.exists, operator: equals, expected: true }
  - { field: facts.service.before.display_name, operator: present }
  - { field: facts.service.before.binary_path, operator: present }
  - { field: facts.service.before.start_type, operator: equals, expected: demand }
  - { field: facts.service.before.state, operator: equals, expected: stopped }
  - { field: facts.service.after.exists, operator: equals, expected: true }
  - { field: facts.service.after.display_name, operator: equals, expected_from_local: facts.service.display_name }
  - { field: facts.service.after.binary_path, operator: equals, expected_from_local: facts.service.binary_path, normalizers: [windows_path] }
  - { field: facts.service.after.start_type, operator: equals, expected: disabled }
  - { field: facts.service.after.state, operator: equals, expected: stopped }
  - { field: facts.service.actor_pid, operator: present }
correlation:
  time_before_seconds: 60
  time_after_seconds: 300
  max_time_difference_ms: 15
  anchors:
    - { local_field: facts.service.name, cloud_field: service.name, strength: strong, normalizers: [lowercase, trim] }
    - { local_field: facts.service.actor_executable, cloud_field: process.executable, strength: strong, normalizers: [windows_path] }
    - { local_field: facts.service.actor_pid, cloud_field: process.pid, strength: medium }
method_selection: { strategy: best }
cloud_expectations:
  - id: service-modify-api-hook
    method: { id: scm_api_hook, title: SCM ChangeServiceConfig API Hook }
    event_type: service_api
    event_actions: [modify]
    cardinality: { min: 1, max: 10 }
    correlation:
      time_from_local: facts.service.completed_at_utc
      anchors:
        - { local_field: facts.service.name, cloud_field: service.name, strength: strong, normalizers: [lowercase, trim] }
        - { local_field: facts.service.actor_executable, cloud_field: process.executable, strength: strong, normalizers: [windows_path] }
        - { local_field: facts.service.actor_pid, cloud_field: process.pid, strength: medium }
    assertions:
      - { field: service.name, operator: equals, expected_from_local: facts.service.name, severity: required, normalizers: [lowercase, trim] }
      - { field: process.pid, operator: equals, expected_from_local: facts.service.actor_pid, severity: required }
      - { field: process.executable, operator: equals, expected_from_local: facts.service.actor_executable, severity: required, normalizers: [windows_path] }
      - { field: service.binary_path, operator: equals, expected_from_local: facts.service.binary_path, severity: required, normalizers: [windows_path] }
      - { field: service.display_name, operator: equals, expected_from_local: facts.service.display_name, severity: recommended }
      - { field: service.start_type, operator: present, severity: recommended }
      - { field: service.old_start_type, operator: present, severity: recommended }
  - id: service-modify-system-7040
    method: { id: system_event_7040, title: Windows System 7040（推荐） }
    event_type: service
    event_actions: [modify]
    cardinality: { min: 1, max: 10 }
    correlation:
      time_from_local: facts.service.completed_at_utc
      anchors:
        - { local_field: facts.service.name, cloud_field: service.name, strength: strong, normalizers: [lowercase, trim] }
    assertions:
      - { field: service.name, operator: equals, expected_from_local: facts.service.name, severity: required, normalizers: [lowercase, trim] }
      - { field: winlog.event_id, operator: equals, expected: 7040, severity: required }
      - { field: service.start_type, operator: present, severity: required }
      - { field: service.old_start_type, operator: present, severity: recommended }
      - field: process.executable
        operator: equals
        expected_from_local: facts.service.actor_executable
        accepted_values:
          - { value: 'C:\Windows\System32\services.exe', message: EDR 仅保留 Service Control Manager 服务侧调用链，需要补充客户端调用链 }
          - { value: 'C:\Windows\System32\svchost.exe', message: EDR 仅保留系统服务侧调用链，需要补充客户端调用链 }
        severity: recommended
        normalizers: [windows_path]
scoring: { weight: 1.0, required_field_weight: 1.0, recommended_field_weight: 0.25 }
metadata:
  owner: edr-validation-team
  status: active
  change_reason: 使用 ChangeServiceConfigW 同时改变唯一标记和 demand→disabled，既形成可验证本地差异，也产生标准 7040 启动类型变更语义。
  references: [Microsoft ChangeServiceConfigW, Windows System Event 7040, Tencent EDR 行为采集]
