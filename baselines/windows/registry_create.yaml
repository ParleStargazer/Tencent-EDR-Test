schema_version: "1.1"
baseline_id: win.registry.create
version: "0.1.0"
title: Windows 注册表键/值创建遥测
description: 以本地 HKCU 唯一键、值名、REG_SZ 数据、Actor 身份和毫秒时间为绝对基准，验证 EDR 是否记录键/值创建。
platform:
  os: windows
  versions: [windows-10, windows-11, windows-server-2019, windows-server-2022]
  architectures: [x64]
risk_level: L1
capability:
  id: win.registry.create
  version: "0.1.0"
  parameters: { post_operation_hold_ms: 1500 }
local_requirements:
  - { field: facts.registry.create_succeeded, operator: equals, expected: true }
  - { field: facts.registry.hive, operator: equals, expected: HKCU }
  - { field: facts.registry.key_path, operator: present }
  - { field: facts.registry.value_name, operator: present }
  - { field: facts.registry.before.key_exists, operator: equals, expected: false }
  - { field: facts.registry.before.value_exists, operator: equals, expected: false }
  - { field: facts.registry.after.key_exists, operator: equals, expected: true }
  - { field: facts.registry.after.value_exists, operator: equals, expected: true }
  - { field: facts.registry.after.value_kind, operator: equals, expected: String }
  - { field: facts.registry.after.value_data, operator: present }
  - { field: facts.registry.after.value_data_sha256, operator: present }
  - { field: facts.registry.actor_pid, operator: present }
correlation:
  time_before_seconds: 60
  time_after_seconds: 300
  max_time_difference_ms: 15
  anchors:
    - { local_field: facts.registry.key_path, cloud_field: registry.key, strength: strong, normalizers: [windows_path] }
    - { local_field: facts.registry.value_name, cloud_field: registry.value_name, strength: strong, normalizers: [lowercase] }
    - { local_field: facts.registry.actor_executable, cloud_field: process.executable, strength: strong, normalizers: [windows_path] }
    - { local_field: facts.registry.actor_pid, cloud_field: process.pid, strength: medium }
cloud_expectations:
  - id: registry-create-event
    event_type: registry
    event_actions: [create]
    cardinality: { min: 1, max: 10 }
    correlation:
      time_from_local: facts.registry.occurred_at_utc
      anchors:
        - { local_field: facts.registry.key_path, cloud_field: registry.key, strength: strong, normalizers: [windows_path] }
        - { local_field: facts.registry.value_name, cloud_field: registry.value_name, strength: strong, normalizers: [lowercase] }
        - { local_field: facts.registry.actor_pid, cloud_field: process.pid, strength: medium }
    assertions:
      - { field: registry.key, operator: equals, expected_from_local: facts.registry.key_path, severity: required, normalizers: [windows_path] }
      - { field: registry.value_name, operator: equals, expected_from_local: facts.registry.value_name, severity: required, normalizers: [lowercase] }
      - { field: process.pid, operator: equals, expected_from_local: facts.registry.actor_pid, severity: required }
      - { field: process.executable, operator: equals, expected_from_local: facts.registry.actor_executable, severity: required, normalizers: [windows_path] }
      - { field: registry.value_data, operator: equals, expected_from_local: facts.registry.after.value_data, severity: recommended }
      - { field: user.name, operator: present, severity: recommended }
scoring: { weight: 1.0, required_field_weight: 1.0, recommended_field_weight: 0.25 }
metadata:
  owner: edr-validation-team
  status: active
  references: [HKCU controlled key, canonical registry fields]
