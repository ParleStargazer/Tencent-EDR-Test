schema_version: "1.1"
baseline_id: win.registry.create
version: "0.2.0"
title: Windows 注册表键/值创建遥测
description: 同轮执行隔离 HKCU 键与启动项 Win32 API 两种子测试；本地验证两者，云端分别判定并采用结果最好的方法形成能力结论。
platform:
  os: windows
  versions: [windows-10, windows-11, windows-server-2019, windows-server-2022]
  architectures: [x64]
risk_level: L1
capability:
  id: win.registry.create
  version: "0.2.0"
  parameters: { post_operation_hold_ms: 1500 }
local_requirements:
  - { field: facts.registry.create_succeeded, operator: equals, expected: true }
  - { field: facts.registry.isolated_key.create_succeeded, operator: equals, expected: true }
  - { field: facts.registry.run_key_native.create_succeeded, operator: equals, expected: true }
  - { field: facts.registry.isolated_key.before.value_exists, operator: equals, expected: false }
  - { field: facts.registry.isolated_key.after.value_exists, operator: equals, expected: true }
  - { field: facts.registry.run_key_native.before.value_exists, operator: equals, expected: false }
  - { field: facts.registry.run_key_native.after.value_exists, operator: equals, expected: true }
  - { field: facts.registry.run_key_native.after.value_kind, operator: equals, expected: String }
  - { field: facts.registry.run_key_native.actor_pid, operator: present }
correlation:
  time_before_seconds: 60
  time_after_seconds: 300
  max_time_difference_ms: 15
  anchors:
    - { local_field: facts.registry.run_key_native.key_path, cloud_field: registry.key, strength: strong, normalizers: [registry_hive_path] }
    - { local_field: facts.registry.run_key_native.value_name, cloud_field: registry.value_name, strength: strong, normalizers: [lowercase] }
    - { local_field: facts.registry.run_key_native.actor_executable, cloud_field: process.executable, strength: strong, normalizers: [windows_path] }
    - { local_field: facts.registry.run_key_native.actor_pid, cloud_field: process.pid, strength: medium }
method_selection: { strategy: best }
cloud_expectations:
  - id: registry-create-isolated-event
    method: { id: isolated_key, title: 隔离 HKCU 键（.NET API） }
    event_type: registry
    event_actions: [create, set_value]
    cardinality: { min: 1, max: 10 }
    correlation:
      time_from_local: facts.registry.isolated_key.occurred_at_utc
      anchors:
        - { local_field: facts.registry.isolated_key.key_path, cloud_field: registry.key, strength: strong, normalizers: [registry_hive_path] }
        - { local_field: facts.registry.isolated_key.value_name, cloud_field: registry.value_name, strength: strong, normalizers: [lowercase] }
        - { local_field: facts.registry.isolated_key.actor_pid, cloud_field: process.pid, strength: medium }
    assertions:
      - { field: registry.key, operator: equals, expected_from_local: facts.registry.isolated_key.key_path, severity: required, normalizers: [registry_hive_path] }
      - { field: registry.value_name, operator: equals, expected_from_local: facts.registry.isolated_key.value_name, severity: required, normalizers: [lowercase] }
      - { field: process.pid, operator: equals, expected_from_local: facts.registry.isolated_key.actor_pid, severity: required }
      - { field: process.executable, operator: equals, expected_from_local: facts.registry.isolated_key.actor_executable, severity: required, normalizers: [windows_path] }
      - { field: registry.value_data, operator: equals, expected_from_local: facts.registry.isolated_key.after.value_data, severity: required }
      - { field: registry.old_value_type, operator: equals, expected: 0, severity: recommended }
      - { field: registry.value_type, operator: present, severity: recommended }
  - id: registry-create-run-key-event
    method: { id: run_key_native, title: 启动项（Win32 API，推荐） }
    event_type: registry
    event_actions: [set_value]
    cardinality: { min: 1, max: 10 }
    correlation:
      time_from_local: facts.registry.run_key_native.occurred_at_utc
      anchors:
        - { local_field: facts.registry.run_key_native.key_path, cloud_field: registry.key, strength: strong, normalizers: [registry_hive_path] }
        - { local_field: facts.registry.run_key_native.value_name, cloud_field: registry.value_name, strength: strong, normalizers: [lowercase] }
        - { local_field: facts.registry.run_key_native.actor_pid, cloud_field: process.pid, strength: medium }
    assertions:
      - { field: registry.key, operator: equals, expected_from_local: facts.registry.run_key_native.key_path, severity: required, normalizers: [registry_hive_path] }
      - { field: registry.value_name, operator: equals, expected_from_local: facts.registry.run_key_native.value_name, severity: required, normalizers: [lowercase] }
      - { field: process.pid, operator: equals, expected_from_local: facts.registry.run_key_native.actor_pid, severity: required }
      - { field: process.executable, operator: equals, expected_from_local: facts.registry.run_key_native.actor_executable, severity: required, normalizers: [windows_path] }
      - { field: registry.value_data, operator: equals, expected_from_local: facts.registry.run_key_native.after.value_data, severity: required }
      - { field: registry.old_value_type, operator: equals, expected: 0, severity: required }
      - { field: registry.value_type, operator: present, severity: required }
      - { field: registry.group_name, operator: equals, expected: 启动项, severity: required }
scoring: { weight: 1.0, required_field_weight: 1.0, recommended_field_weight: 0.25 }
metadata:
  owner: edr-validation-team
  status: active
  change_reason: 真实导出显示产品按注册表重点分组采集；新增 Run 启动项原生 API 方法，并以旧类型 0 证明值创建。
  references: [reference/reg/edr_reg_relate.json, Tencent EDR RegEvents / RegSetValue]
