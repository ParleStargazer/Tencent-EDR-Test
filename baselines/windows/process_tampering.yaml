schema_version: "1.1"
baseline_id: win.process.tampering
version: "0.1.0"
title: Windows 进程篡改活动遥测
description: 验证 Actor 对本轮受控 Target 执行受限内存写入后，云端存在对应源进程和目标进程事件。
platform:
  os: windows
  versions: [windows-10, windows-11, windows-server-2019, windows-server-2022]
  architectures: [x64]
risk_level: L2
capability:
  id: win.process.tampering
  version: "0.1.0"
  parameters:
    payload_size: 64
local_requirements:
  - field: facts.process.tamper_succeeded
    operator: equals
    expected: true
  - field: facts.process.before_sha256
    operator: present
  - field: facts.process.after_sha256
    operator: present
  - field: facts.process.memory_released
    operator: equals
    expected: true
correlation:
  time_before_seconds: 60
  time_after_seconds: 300
  anchors:
    - local_field: programs.target.executable
      cloud_field: process.executable
      strength: strong
      normalizers: [windows_path]
    - local_field: programs.actor.executable
      cloud_field: source_process.executable
      strength: strong
      normalizers: [windows_path]
    - local_field: programs.target.pid
      cloud_field: process.pid
      strength: medium
cloud_expectations:
  - id: process-tampering-event
    event_type: process
    event_actions: [tamper]
    cardinality: { min: 1, max: 5 }
    assertions:
      - field: process.pid
        operator: equals
        expected_from_local: programs.target.pid
        severity: required
      - field: process.executable
        operator: equals
        expected_from_local: programs.target.executable
        severity: required
        normalizers: [windows_path]
      - field: source_process.pid
        operator: equals
        expected_from_local: programs.actor.pid
        severity: required
      - field: source_process.executable
        operator: equals
        expected_from_local: programs.actor.executable
        severity: required
        normalizers: [windows_path]
scoring: { weight: 1.0, required_field_weight: 1.0, recommended_field_weight: 0.25 }
metadata:
  owner: edr-validation-team
  status: draft
  references: [EDR-Telemetry / Windows / Process Activity / Process Tampering Activity]
