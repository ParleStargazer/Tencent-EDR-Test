schema_version: "1.1"
baseline_id: win.scheduled_task.delete
version: "0.3.0"
title: Windows 计划任务删除遥测
description: 以 COM 删除和受控 Windows 安全审计删除作为两个独立本地激发方法；安全审计方法必须生成 4699 并恢复策略。腾讯 EDR 尚无已实现的删除导出动作，因此保留规划性云端要求，不以云端通过作为本轮样本验收目标。
platform:
  os: windows
  versions: [windows-10, windows-11, windows-server-2019, windows-server-2022]
  architectures: [x64]
risk_level: L2
capability:
  id: win.scheduled_task.delete
  version: "0.3.0"
  parameters: { post_operation_hold_ms: 1500 }
local_requirements:
  - { field: facts.scheduled_task.delete_succeeded, operator: equals, expected: true }
  - { field: facts.scheduled_task.task_scheduler_com.delete_succeeded, operator: equals, expected: true }
  - { field: facts.scheduled_task.task_scheduler_com.task_path, operator: present }
  - { field: facts.scheduled_task.task_scheduler_com.before.exists, operator: equals, expected: true }
  - { field: facts.scheduled_task.task_scheduler_com.before.xml_sha256, operator: present }
  - { field: facts.scheduled_task.task_scheduler_com.after.exists, operator: equals, expected: false }
  - { field: facts.scheduled_task.task_scheduler_com.actor_pid, operator: present }
  - { field: facts.scheduled_task.security_audit_delete.delete_succeeded, operator: equals, expected: true }
  - { field: facts.scheduled_task.security_audit_delete.task_path, operator: present }
  - { field: facts.scheduled_task.security_audit_delete.before.exists, operator: equals, expected: true }
  - { field: facts.scheduled_task.security_audit_delete.before.xml_sha256, operator: present }
  - { field: facts.scheduled_task.security_audit_delete.after.exists, operator: equals, expected: false }
  - { field: facts.scheduled_task.security_audit_delete.actor_pid, operator: present }
  - { field: facts.scheduled_task.security_audit_delete.security_event_id, operator: equals, expected: 4699 }
  - { field: facts.scheduled_task.security_audit_delete.security_event_found, operator: equals, expected: true }
  - { field: facts.scheduled_task.security_audit_delete.security_event_occurred_at_utc, operator: present }
  - { field: facts.scheduled_task.security_audit_delete.security_event_record_id, operator: present }
  - { field: facts.scheduled_task.security_audit_delete.audit_success_enabled, operator: equals, expected: true }
  - { field: facts.scheduled_task.security_audit_delete.audit_policy_restore_succeeded, operator: equals, expected: true }
correlation:
  time_before_seconds: 60
  time_after_seconds: 300
  max_time_difference_ms: 15
  anchors:
    - { local_field: facts.scheduled_task.security_audit_delete.task_path, cloud_field: scheduled_task.name, strength: strong, normalizers: [lowercase, trim] }
    - { local_field: facts.scheduled_task.security_audit_delete.actor_executable, cloud_field: process.executable, strength: medium, normalizers: [windows_path] }
method_selection: { strategy: best }
cloud_expectations:
  - id: scheduled-task-delete-security-audit-event
    method: { id: security_audit_delete, title: Windows 安全审计删除（4699，腾讯侧规划） }
    event_type: scheduled_task
    event_actions: [delete]
    cardinality: { min: 1, max: 10 }
    correlation:
      time_from_local: facts.scheduled_task.security_audit_delete.security_event_occurred_at_utc
      anchors:
        - { local_field: facts.scheduled_task.security_audit_delete.task_path, cloud_field: scheduled_task.name, strength: strong, normalizers: [lowercase, trim] }
        - { local_field: facts.scheduled_task.security_audit_delete.actor_executable, cloud_field: process.executable, strength: medium, normalizers: [windows_path] }
    assertions:
      - { field: scheduled_task.name, operator: equals, expected_from_local: facts.scheduled_task.security_audit_delete.task_path, severity: required, normalizers: [lowercase, trim] }
      - { field: winlog.event_id, operator: equals, expected: 4699, severity: required }
      - { field: process.executable, operator: present, severity: recommended }
      - { field: user.id, operator: present, severity: recommended }
scoring: { weight: 1.0, required_field_weight: 1.0, recommended_field_weight: 0.25 }
metadata:
  owner: edr-validation-team
  status: planned
  change_reason: 删除子测试与创建/修改使用相同的受控审核激发链并以本机 4699 自验证；reference/scheduled_task 未出现 SchedTaskDelete，腾讯 EDR 当前按未实现处理，云端要求仅保留字段与映射规划。
  references: [reference/scheduled_task, Windows Security Event 4699, Tencent EDR planned SchedTaskDelete]
