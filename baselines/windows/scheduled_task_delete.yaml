schema_version: "1.1"
baseline_id: win.scheduled_task.delete
version: "0.1.0"
title: Windows 计划任务删除遥测
description: 以本轮唯一任务路径和精确行为时间关联 Windows 安全事件 4699；腾讯 EDR 删除动作按 SchedTaskDelete 假定支持，等待实测确认。
platform:
  os: windows
  versions: [windows-10, windows-11, windows-server-2019, windows-server-2022]
  architectures: [x64]
risk_level: L1
capability:
  id: win.scheduled_task.delete
  version: "0.1.0"
  parameters: { post_operation_hold_ms: 1500 }
local_requirements:
  - { field: facts.scheduled_task.delete_succeeded, operator: equals, expected: true }
  - { field: facts.scheduled_task.task_path, operator: present }
  - { field: facts.scheduled_task.before.exists, operator: equals, expected: true }
  - { field: facts.scheduled_task.before.xml_sha256, operator: present }
  - { field: facts.scheduled_task.before.principal, operator: present }
  - { field: facts.scheduled_task.before.enabled, operator: equals, expected: false }
  - { field: facts.scheduled_task.after.exists, operator: equals, expected: false }
  - { field: facts.scheduled_task.actor_pid, operator: present }
correlation:
  time_before_seconds: 60
  time_after_seconds: 300
  max_time_difference_ms: 15
  anchors:
    - { local_field: facts.scheduled_task.task_path, cloud_field: scheduled_task.name, strength: strong, normalizers: [lowercase, trim] }
    - { local_field: facts.scheduled_task.actor_executable, cloud_field: process.executable, strength: medium, normalizers: [windows_path] }
    - { local_field: facts.scheduled_task.actor_pid, cloud_field: process.pid, strength: medium }
cloud_expectations:
  - id: scheduled-task-delete-event
    event_type: scheduled_task
    event_actions: [delete]
    cardinality: { min: 1, max: 5 }
    correlation:
      time_from_local: facts.scheduled_task.occurred_at_utc
      anchors:
        - { local_field: facts.scheduled_task.task_path, cloud_field: scheduled_task.name, strength: strong, normalizers: [lowercase, trim] }
        - { local_field: facts.scheduled_task.actor_executable, cloud_field: process.executable, strength: medium, normalizers: [windows_path] }
        - { local_field: facts.scheduled_task.actor_pid, cloud_field: process.pid, strength: medium }
    assertions:
      - { field: scheduled_task.name, operator: equals, expected_from_local: facts.scheduled_task.task_path, severity: required, normalizers: [lowercase, trim] }
      - { field: winlog.event_id, operator: equals, expected: 4699, severity: required }
      - field: process.executable
        operator: equals
        expected_from_local: facts.scheduled_task.actor_executable
        accepted_values:
          - { value: 'C:\Windows\System32\svchost.exe', message: EDR 仅保留 Task Scheduler 服务侧调用链，需要补充客户端调用链 }
        severity: recommended
        normalizers: [windows_path]
      - { field: user.id, operator: present, severity: recommended }
scoring: { weight: 1.0, required_field_weight: 1.0, recommended_field_weight: 0.25 }
metadata:
  owner: edr-validation-team
  status: active
  change_reason: Windows 4699 定义删除语义；产品动作 SchedTaskDelete 目前无真实导出样本，保持 active 假定并明确等待实测校准。
  references: [Windows Security Event 4699, Tencent EDR ScheduleTaskEvents / assumed SchedTaskDelete]
