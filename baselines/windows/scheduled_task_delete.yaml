schema_version: "1.1"
baseline_id: win.scheduled_task.delete
version: "0.2.0"
title: Windows 计划任务删除遥测
description: 同轮分别通过 Task Scheduler COM 与 schtasks.exe /Delete 删除两个唯一任务；本地任务消失是绝对基准，两种方法都以 Windows 4699/SchedTaskDelete 作为直接云端证据并采用最佳方法形成能力结论。
platform:
  os: windows
  versions: [windows-10, windows-11, windows-server-2019, windows-server-2022]
  architectures: [x64]
risk_level: L1
capability:
  id: win.scheduled_task.delete
  version: "0.2.0"
  parameters: { post_operation_hold_ms: 1500 }
local_requirements:
  - { field: facts.scheduled_task.delete_succeeded, operator: equals, expected: true }
  - { field: facts.scheduled_task.task_scheduler_com.delete_succeeded, operator: equals, expected: true }
  - { field: facts.scheduled_task.task_scheduler_com.task_path, operator: present }
  - { field: facts.scheduled_task.task_scheduler_com.before.exists, operator: equals, expected: true }
  - { field: facts.scheduled_task.task_scheduler_com.before.xml_sha256, operator: present }
  - { field: facts.scheduled_task.task_scheduler_com.before.principal, operator: present }
  - { field: facts.scheduled_task.task_scheduler_com.before.enabled, operator: equals, expected: false }
  - { field: facts.scheduled_task.task_scheduler_com.after.exists, operator: equals, expected: false }
  - { field: facts.scheduled_task.task_scheduler_com.actor_pid, operator: present }
  - { field: facts.scheduled_task.schtasks_cli.delete_succeeded, operator: equals, expected: true }
  - { field: facts.scheduled_task.schtasks_cli.task_path, operator: present }
  - { field: facts.scheduled_task.schtasks_cli.before.exists, operator: equals, expected: true }
  - { field: facts.scheduled_task.schtasks_cli.before.xml_sha256, operator: present }
  - { field: facts.scheduled_task.schtasks_cli.before.principal, operator: present }
  - { field: facts.scheduled_task.schtasks_cli.before.enabled, operator: equals, expected: false }
  - { field: facts.scheduled_task.schtasks_cli.after.exists, operator: equals, expected: false }
  - { field: facts.scheduled_task.schtasks_cli.actor_pid, operator: present }
  - { field: facts.scheduled_task.schtasks_cli.security_event_id, operator: equals, expected: 4699 }
correlation:
  time_before_seconds: 60
  time_after_seconds: 300
  max_time_difference_ms: 15
  anchors:
    - { local_field: facts.scheduled_task.schtasks_cli.task_path, cloud_field: scheduled_task.name, strength: strong, normalizers: [lowercase, trim] }
    - { local_field: facts.scheduled_task.schtasks_cli.actor_executable, cloud_field: process.executable, strength: medium, normalizers: [windows_path] }
    - { local_field: facts.scheduled_task.schtasks_cli.actor_pid, cloud_field: process.pid, strength: medium }
method_selection: { strategy: best }
cloud_expectations:
  - id: scheduled-task-delete-com-security-event
    method: { id: task_scheduler_com, title: Task Scheduler COM 删除 + Windows 4699 }
    event_type: scheduled_task
    event_actions: [delete]
    cardinality: { min: 1, max: 10 }
    correlation:
      time_from_local: facts.scheduled_task.task_scheduler_com.completed_at_utc
      anchors:
        - { local_field: facts.scheduled_task.task_scheduler_com.task_path, cloud_field: scheduled_task.name, strength: strong, normalizers: [lowercase, trim] }
        - { local_field: facts.scheduled_task.task_scheduler_com.actor_executable, cloud_field: process.executable, strength: medium, normalizers: [windows_path] }
        - { local_field: facts.scheduled_task.task_scheduler_com.actor_pid, cloud_field: process.pid, strength: medium }
    assertions:
      - { field: scheduled_task.name, operator: equals, expected_from_local: facts.scheduled_task.task_scheduler_com.task_path, severity: required, normalizers: [lowercase, trim] }
      - { field: winlog.event_id, operator: equals, expected: 4699, severity: required }
      - field: process.executable
        operator: equals
        expected_from_local: facts.scheduled_task.task_scheduler_com.actor_executable
        accepted_values:
          - { value: 'C:\Windows\System32\svchost.exe', message: EDR 仅保留 Task Scheduler 服务侧调用链，需要补充客户端调用链 }
        severity: recommended
        normalizers: [windows_path]
      - { field: user.id, operator: present, severity: recommended }
  - id: scheduled-task-delete-cli-security-event
    method: { id: schtasks_cli, title: 系统 schtasks.exe /Delete + Windows 4699 }
    event_type: scheduled_task
    event_actions: [delete]
    cardinality: { min: 1, max: 10 }
    correlation:
      time_from_local: facts.scheduled_task.schtasks_cli.completed_at_utc
      anchors:
        - { local_field: facts.scheduled_task.schtasks_cli.task_path, cloud_field: scheduled_task.name, strength: strong, normalizers: [lowercase, trim] }
        - { local_field: facts.scheduled_task.schtasks_cli.actor_executable, cloud_field: process.executable, strength: medium, normalizers: [windows_path] }
        - { local_field: facts.scheduled_task.schtasks_cli.actor_pid, cloud_field: process.pid, strength: medium }
    assertions:
      - { field: scheduled_task.name, operator: equals, expected_from_local: facts.scheduled_task.schtasks_cli.task_path, severity: required, normalizers: [lowercase, trim] }
      - { field: winlog.event_id, operator: equals, expected: 4699, severity: required }
      - field: process.executable
        operator: equals
        expected_from_local: facts.scheduled_task.schtasks_cli.actor_executable
        accepted_values:
          - { value: 'C:\Windows\System32\svchost.exe', message: EDR 仅保留 Task Scheduler 服务侧调用链，需要补充客户端调用链 }
        severity: recommended
        normalizers: [windows_path]
      - { field: user.id, operator: present, severity: recommended }
scoring: { weight: 1.0, required_field_weight: 1.0, recommended_field_weight: 0.25 }
metadata:
  owner: edr-validation-team
  status: active
  change_reason: 把删除扩展为 COM 与 schtasks.exe /Delete 两种独立方法；两者都以 4699/SchedTaskDelete 验证删除语义，不虚构未在参考日志中出现的 RPC 删除动作。
  references: [reference/260814140000run, reference/EDR能力细节.txt, Windows Security Event 4699, Tencent EDR ScheduleTaskEvents / assumed SchedTaskDelete]
