scoring: { weight: 1.0, required_field_weight: 1.0, recommended_field_weight: 0.25 }
metadata:
  owner: edr-validation-team
  status: active
  change_reason: reference/edr_FileDelete.json 的 1187 条 FileDelete 记录中没有任何 TXT 或 JSON；文件类型仅有 DLL、EXE、PS1、JS、SYS、XML、PNG，报告大小在 4–16 KiB 的 28 条记录全部为 DLL，主要由 dotnet/MSBuild 删除。因此在保留三个既有方法的基础上，新增 DLL + File.Delete、JSON + FileDispositionInfo、DLL + FileDispositionInfo 三种落地至少 5 秒的独立方法，以分别验证文件类型和删除调用链两个变量；继续以 15 ms 时间、完整路径、Actor 路径和 PID 为强关联，大小及 MD5 为推荐证据。
  references: [reference/edr_FileDelete.json, reference/EDR日志-字段表.txt, Tencent EDR FileEvents / FileDelete]
