schema_version: "1.1"
baseline_id: win.file.delete
version: "0.4.0"
title: Windows 文件删除遥测
description: 同轮执行即时 TXT、即时 JSON、延迟 JSON 三个既有方法，并新增 DLL + File.Delete、JSON + FileDispositionInfo、DLL + FileDispositionInfo 三种落地 5 秒删除方法；本地逐项验证，云端分别判定并采用结果最好的方法形成能力结论。
platform:
  os: windows
  versions: [windows-10, windows-11, windows-server-2019, windows-server-2022]
  architectures: [x64]
risk_level: L0
capability:
  id: win.file.delete
  version: "0.4.0"
  parameters: { payload_size: 8192, post_operation_hold_ms: 1500 }
local_requirements:
  - { field: facts.file.delete_succeeded, operator: equals, expected: true }
  - { field: facts.file.txt.delete_succeeded, operator: equals, expected: true }
  - { field: facts.file.json.delete_succeeded, operator: equals, expected: true }
  - { field: facts.file.json.extension, operator: equals, expected: ".json" }
  - { field: facts.file.json.path, operator: present }
  - { field: facts.file.json.before.exists, operator: equals, expected: true }
  - { field: facts.file.json.after.exists, operator: equals, expected: false }
  - { field: facts.file.json.before.md5, operator: present }
  - { field: facts.file.json.actor_pid, operator: present }
  - { field: facts.file.json_delayed_5s.delete_succeeded, operator: equals, expected: true }
  - { field: facts.file.json_delayed_5s.extension, operator: equals, expected: ".json" }
  - { field: facts.file.json_delayed_5s.path, operator: present }
  - { field: facts.file.json_delayed_5s.landed_at_utc, operator: present }
  - { field: facts.file.json_delayed_5s.requested_delay_ms, operator: equals, expected: 5000 }
  - { field: facts.file.json_delayed_5s.settle_elapsed_ms, operator: range, expected: { min: 5000, max: 30000 } }
  - { field: facts.file.json_delayed_5s.landed_to_delete_ms, operator: range, expected: { min: 5000, max: 30000 } }
  - { field: facts.file.json_delayed_5s.before.exists, operator: equals, expected: true }
  - { field: facts.file.json_delayed_5s.after.exists, operator: equals, expected: false }
  - { field: facts.file.json_delayed_5s.actor_pid, operator: present }
  - { field: facts.file.dll_dotnet_delete_5s.delete_succeeded, operator: equals, expected: true }
  - { field: facts.file.dll_dotnet_delete_5s.extension, operator: equals, expected: ".dll" }
  - { field: facts.file.dll_dotnet_delete_5s.deletion_method, operator: equals, expected: dotnet_file_delete }
  - { field: facts.file.dll_dotnet_delete_5s.path, operator: present }
  - { field: facts.file.dll_dotnet_delete_5s.landed_at_utc, operator: present }
  - { field: facts.file.dll_dotnet_delete_5s.requested_delay_ms, operator: equals, expected: 5000 }
  - { field: facts.file.dll_dotnet_delete_5s.settle_elapsed_ms, operator: range, expected: { min: 5000, max: 30000 } }
  - { field: facts.file.dll_dotnet_delete_5s.landed_to_delete_ms, operator: range, expected: { min: 5000, max: 30000 } }
  - { field: facts.file.dll_dotnet_delete_5s.before.exists, operator: equals, expected: true }
  - { field: facts.file.dll_dotnet_delete_5s.after.exists, operator: equals, expected: false }
  - { field: facts.file.dll_dotnet_delete_5s.actor_pid, operator: present }
  - { field: facts.file.json_disposition_5s.delete_succeeded, operator: equals, expected: true }
  - { field: facts.file.json_disposition_5s.extension, operator: equals, expected: ".json" }
  - { field: facts.file.json_disposition_5s.deletion_method, operator: equals, expected: file_disposition_info }
  - { field: facts.file.json_disposition_5s.path, operator: present }
  - { field: facts.file.json_disposition_5s.landed_at_utc, operator: present }
  - { field: facts.file.json_disposition_5s.requested_delay_ms, operator: equals, expected: 5000 }
  - { field: facts.file.json_disposition_5s.settle_elapsed_ms, operator: range, expected: { min: 5000, max: 30000 } }
  - { field: facts.file.json_disposition_5s.landed_to_delete_ms, operator: range, expected: { min: 5000, max: 30000 } }
  - { field: facts.file.json_disposition_5s.before.exists, operator: equals, expected: true }
  - { field: facts.file.json_disposition_5s.after.exists, operator: equals, expected: false }
  - { field: facts.file.json_disposition_5s.actor_pid, operator: present }
  - { field: facts.file.dll_disposition_5s.delete_succeeded, operator: equals, expected: true }
  - { field: facts.file.dll_disposition_5s.extension, operator: equals, expected: ".dll" }
  - { field: facts.file.dll_disposition_5s.deletion_method, operator: equals, expected: file_disposition_info }
  - { field: facts.file.dll_disposition_5s.path, operator: present }
  - { field: facts.file.dll_disposition_5s.landed_at_utc, operator: present }
  - { field: facts.file.dll_disposition_5s.requested_delay_ms, operator: equals, expected: 5000 }
  - { field: facts.file.dll_disposition_5s.settle_elapsed_ms, operator: range, expected: { min: 5000, max: 30000 } }
  - { field: facts.file.dll_disposition_5s.landed_to_delete_ms, operator: range, expected: { min: 5000, max: 30000 } }
  - { field: facts.file.dll_disposition_5s.before.exists, operator: equals, expected: true }
  - { field: facts.file.dll_disposition_5s.after.exists, operator: equals, expected: false }
  - { field: facts.file.dll_disposition_5s.actor_pid, operator: present }
correlation:
  time_before_seconds: 60
  time_after_seconds: 300
  max_time_difference_ms: 15
  anchors:
    - { local_field: facts.file.json.path, cloud_field: file.path, strength: strong, normalizers: [windows_path] }
    - { local_field: facts.file.json.actor_executable, cloud_field: process.executable, strength: strong, normalizers: [windows_path] }
    - { local_field: facts.file.json.actor_pid, cloud_field: process.pid, strength: medium }
method_selection: { strategy: best }
cloud_expectations:
  - id: file-delete-txt-event
    method: { id: txt, title: TXT 文件 }
    event_type: file
    event_actions: [delete]
    cardinality: { min: 1, max: 5 }
    correlation:
      time_from_local: facts.file.txt.occurred_at_utc
      anchors:
        - { local_field: facts.file.txt.path, cloud_field: file.path, strength: strong, normalizers: [windows_path] }
        - { local_field: facts.file.txt.actor_pid, cloud_field: process.pid, strength: medium }
    assertions:
      - { field: file.path, operator: equals, expected_from_local: facts.file.txt.path, severity: required, normalizers: [windows_path] }
      - { field: process.pid, operator: equals, expected_from_local: facts.file.txt.actor_pid, severity: required }
      - { field: process.executable, operator: equals, expected_from_local: facts.file.txt.actor_executable, severity: required, normalizers: [windows_path] }
      - { field: file.size, operator: equals, expected_from_local: facts.file.txt.before.size_bytes, severity: required }
      - { field: file.hash.md5, operator: equals, expected_from_local: facts.file.txt.before.md5, severity: recommended, normalizers: [lowercase] }
      - { field: user.name, operator: present, severity: recommended }
  - id: file-delete-json-event
    method: { id: json, title: JSON 文件 }
    event_type: file
    event_actions: [delete]
    cardinality: { min: 1, max: 5 }
    correlation:
      time_from_local: facts.file.json.occurred_at_utc
      anchors:
        - { local_field: facts.file.json.path, cloud_field: file.path, strength: strong, normalizers: [windows_path] }
        - { local_field: facts.file.json.actor_pid, cloud_field: process.pid, strength: medium }
    assertions:
      - { field: file.path, operator: equals, expected_from_local: facts.file.json.path, severity: required, normalizers: [windows_path] }
      - { field: process.pid, operator: equals, expected_from_local: facts.file.json.actor_pid, severity: required }
      - { field: process.executable, operator: equals, expected_from_local: facts.file.json.actor_executable, severity: required, normalizers: [windows_path] }
      - { field: file.size, operator: equals, expected_from_local: facts.file.json.before.size_bytes, severity: required }
      - { field: file.hash.md5, operator: equals, expected_from_local: facts.file.json.before.md5, severity: recommended, normalizers: [lowercase] }
      - { field: user.name, operator: present, severity: recommended }
  - id: file-delete-json-delayed-5s-event
    method: { id: json_delayed_5s, title: JSON 文件 · 落地 5 秒后删除 }
    event_type: file
    event_actions: [delete]
    cardinality: { min: 1, max: 5 }
    correlation:
      time_from_local: facts.file.json_delayed_5s.occurred_at_utc
      anchors:
        - { local_field: facts.file.json_delayed_5s.path, cloud_field: file.path, strength: strong, normalizers: [windows_path] }
        - { local_field: facts.file.json_delayed_5s.actor_pid, cloud_field: process.pid, strength: medium }
    assertions:
      - { field: file.path, operator: equals, expected_from_local: facts.file.json_delayed_5s.path, severity: required, normalizers: [windows_path] }
      - { field: process.pid, operator: equals, expected_from_local: facts.file.json_delayed_5s.actor_pid, severity: required }
      - { field: process.executable, operator: equals, expected_from_local: facts.file.json_delayed_5s.actor_executable, severity: required, normalizers: [windows_path] }
      - { field: file.size, operator: present, severity: recommended }
      - { field: file.hash.md5, operator: equals, expected_from_local: facts.file.json_delayed_5s.before.md5, severity: recommended, normalizers: [lowercase] }
      - { field: user.name, operator: present, severity: recommended }
  - id: file-delete-dll-dotnet-5s-event
    method: { id: dll_dotnet_delete_5s, title: DLL 文件 · 落地 5 秒 · File.Delete }
    event_type: file
    event_actions: [delete]
    cardinality: { min: 1, max: 5 }
    correlation:
      time_from_local: facts.file.dll_dotnet_delete_5s.occurred_at_utc
      anchors:
        - { local_field: facts.file.dll_dotnet_delete_5s.path, cloud_field: file.path, strength: strong, normalizers: [windows_path] }
        - { local_field: facts.file.dll_dotnet_delete_5s.actor_pid, cloud_field: process.pid, strength: medium }
    assertions:
      - { field: file.path, operator: equals, expected_from_local: facts.file.dll_dotnet_delete_5s.path, severity: required, normalizers: [windows_path] }
      - { field: process.pid, operator: equals, expected_from_local: facts.file.dll_dotnet_delete_5s.actor_pid, severity: required }
      - { field: process.executable, operator: equals, expected_from_local: facts.file.dll_dotnet_delete_5s.actor_executable, severity: required, normalizers: [windows_path] }
      - { field: file.size, operator: equals, expected_from_local: facts.file.dll_dotnet_delete_5s.before.size_bytes, severity: recommended }
      - { field: file.hash.md5, operator: equals, expected_from_local: facts.file.dll_dotnet_delete_5s.before.md5, severity: recommended, normalizers: [lowercase] }
      - { field: user.name, operator: present, severity: recommended }
  - id: file-delete-json-disposition-5s-event
    method: { id: json_disposition_5s, title: JSON 文件 · 落地 5 秒 · FileDispositionInfo }
    event_type: file
    event_actions: [delete]
    cardinality: { min: 1, max: 5 }
    correlation:
      time_from_local: facts.file.json_disposition_5s.occurred_at_utc
      anchors:
        - { local_field: facts.file.json_disposition_5s.path, cloud_field: file.path, strength: strong, normalizers: [windows_path] }
        - { local_field: facts.file.json_disposition_5s.actor_pid, cloud_field: process.pid, strength: medium }
    assertions:
      - { field: file.path, operator: equals, expected_from_local: facts.file.json_disposition_5s.path, severity: required, normalizers: [windows_path] }
      - { field: process.pid, operator: equals, expected_from_local: facts.file.json_disposition_5s.actor_pid, severity: required }
      - { field: process.executable, operator: equals, expected_from_local: facts.file.json_disposition_5s.actor_executable, severity: required, normalizers: [windows_path] }
      - { field: file.size, operator: present, severity: recommended }
      - { field: file.hash.md5, operator: equals, expected_from_local: facts.file.json_disposition_5s.before.md5, severity: recommended, normalizers: [lowercase] }
      - { field: user.name, operator: present, severity: recommended }
  - id: file-delete-dll-disposition-5s-event
    method: { id: dll_disposition_5s, title: DLL 文件 · 落地 5 秒 · FileDispositionInfo }
    event_type: file
    event_actions: [delete]
    cardinality: { min: 1, max: 5 }
    correlation:
      time_from_local: facts.file.dll_disposition_5s.occurred_at_utc
      anchors:
        - { local_field: facts.file.dll_disposition_5s.path, cloud_field: file.path, strength: strong, normalizers: [windows_path] }
        - { local_field: facts.file.dll_disposition_5s.actor_pid, cloud_field: process.pid, strength: medium }
