correlation:
  time_before_seconds: 60
  time_after_seconds: 300
  max_time_difference_ms: 15
  anchors:
    - { local_field: facts.file.json.path, cloud_field: file.path, strength: strong, normalizers: [windows_path] }
    - { local_field: facts.file.json.actor_executable, cloud_field: process.executable, strength: strong, normalizers: [windows_path] }
    - { local_field: facts.file.json.actor_pid, cloud_field: process.pid, strength: medium }
method_selection: { strategy: best }
cloud_expectations:
  - id: file-delete-txt-event
    method: { id: txt, title: TXT 文件 }
    event_type: file
    event_actions: [delete]
    cardinality: { min: 1, max: 5 }
    correlation:
      time_from_local: facts.file.txt.occurred_at_utc
      anchors:
        - { local_field: facts.file.txt.path, cloud_field: file.path, strength: strong, normalizers: [windows_path] }
        - { local_field: facts.file.txt.actor_pid, cloud_field: process.pid, strength: medium }
    assertions:
      - { field: file.path, operator: equals, expected_from_local: facts.file.txt.path, severity: required, normalizers: [windows_path] }
      - { field: process.pid, operator: equals, expected_from_local: facts.file.txt.actor_pid, severity: required }
      - { field: process.executable, operator: equals, expected_from_local: facts.file.txt.actor_executable, severity: required, normalizers: [windows_path] }
      - { field: file.hash.md5, operator: equals, expected_from_local: facts.file.txt.before.md5, severity: recommended, normalizers: [lowercase] }
      - { field: user.name, operator: present, severity: recommended }
  - id: file-delete-json-event
    method: { id: json, title: JSON 文件 }
    event_type: file
    event_actions: [delete]
    cardinality: { min: 1, max: 5 }
    correlation:
      time_from_local: facts.file.json.occurred_at_utc
      anchors:
        - { local_field: facts.file.json.path, cloud_field: file.path, strength: strong, normalizers: [windows_path] }
        - { local_field: facts.file.json.actor_pid, cloud_field: process.pid, strength: medium }
    assertions:
