scoring: { weight: 1.0, required_field_weight: 1.0, recommended_field_weight: 0.25 }
metadata:
  owner: edr-validation-team
  status: active
  change_reason: reference/edr_filedeletion.json 与 runs/20260824 证明 FileDelete 的 Child.FileSize=0 是异步删除事件中的未补全值，而非文件真实大小。同一 DLL 在删除前 FileWriteClose 中为 14848 字节，紧随的 FileDelete 在 File.Delete 与 FileDispositionInfo 两种独立方法中均为 0，但路径、Actor PID、MD5 和 1–2 ms 时间关联均正确。因此云端删除结论不再要求 file.size；本地仍保留删除前字节数作为绝对基准，云端以时间、完整路径、Actor 路径、PID 和 MD5 形成删除能力证据。
  references: [reference/edr_filedeletion.json, reference/EDR日志-字段表.txt, runs/20260824, Tencent EDR FileEvents / FileDelete]
