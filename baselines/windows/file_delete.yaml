      - { field: file.size, operator: equals, expected_from_local: facts.file.dll_disposition_5s.before.size_bytes, severity: recommended }
      - { field: file.hash.md5, operator: equals, expected_from_local: facts.file.dll_disposition_5s.before.md5, severity: recommended, normalizers: [lowercase] }
