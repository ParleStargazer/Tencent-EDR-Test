schema_version: "1.1"
baseline_id: win.account.logoff
version: "0.1.0"
title: Windows 账号注销遥测
description: 关闭由 LogonUserW 建立的唯一临时账号令牌，以账号、SID、同一 AuthenticationId 与精确关闭时间关联 Windows 安全事件 4634 或 4647。
platform:
  os: windows
  versions: [windows-10, windows-11, windows-server-2019, windows-server-2022]
  architectures: [x64]
risk_level: L1
capability:
  id: win.account.logoff
  version: "0.1.0"
  parameters: { setup_delay_ms: 750, post_operation_hold_ms: 1500 }
local_requirements:
  - { field: facts.account.logoff_succeeded, operator: equals, expected: true }
  - { field: facts.account.name, operator: present }
  - { field: facts.account.sid, operator: present }
  - { field: facts.account.session.logon_id, operator: present }
  - { field: facts.account.session.logon_type, operator: equals, expected: 3 }
  - { field: facts.account.session.token_validated, operator: equals, expected: true }
  - { field: facts.account.actor_pid, operator: present }
correlation:
  time_before_seconds: 60
  time_after_seconds: 300
  max_time_difference_ms: 10
  anchors:
    - { local_field: facts.account.name, cloud_field: user.target.name, strength: strong, normalizers: [lowercase] }
    - { local_field: facts.account.sid, cloud_field: user.target.id, strength: strong, normalizers: [sid] }
    - { local_field: facts.account.session.logon_id, cloud_field: winlog.logon.id, strength: strong, normalizers: [lowercase] }
cloud_expectations:
  - id: account-logoff-event
    event_type: account
    event_actions: [logoff]
    cardinality: { min: 1, max: 5 }
    correlation:
      time_from_local: facts.account.occurred_at_utc
      anchors:
        - { local_field: facts.account.name, cloud_field: user.target.name, strength: strong, normalizers: [lowercase] }
        - { local_field: facts.account.sid, cloud_field: user.target.id, strength: strong, normalizers: [sid] }
        - { local_field: facts.account.session.logon_id, cloud_field: winlog.logon.id, strength: strong, normalizers: [lowercase] }
    assertions:
      - { field: user.target.name, operator: equals, expected_from_local: facts.account.name, severity: required, normalizers: [lowercase] }
      - { field: user.target.id, operator: equals, expected_from_local: facts.account.sid, severity: required, normalizers: [sid] }
      - { field: winlog.logon.id, operator: equals, expected_from_local: facts.account.session.logon_id, severity: required, normalizers: [lowercase] }
      - { field: winlog.event_id, operator: one_of, expected: [4634, 4647], severity: required }
      - { field: winlog.logon.type, operator: present, severity: recommended }
scoring: { weight: 1.0, required_field_weight: 1.0, recommended_field_weight: 0.25 }
metadata:
  owner: edr-validation-team
  status: active
  change_reason: 首次实现基于同一登录 AuthenticationId 与令牌关闭时刻的注销遥测基准。
  references: [Windows Security Event 4634, Windows Security Event 4647, CloseHandle logon token, Tencent EDR LoginEvents]
