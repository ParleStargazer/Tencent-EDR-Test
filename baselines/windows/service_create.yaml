schema_version: "1.1"
baseline_id: win.service.create
version: "0.1.0"
title: Windows 服务创建遥测
description: 本地以 SCM 独立查询确认唯一禁用服务确实创建；云端 API Hook 直接证据为 ServiceEvents/CreateService，Common.EventTime 应与调用开始时间关联，同时保留 System 7045 兼容路径。
platform:
  os: windows
  versions: [windows-10, windows-11, windows-server-2019, windows-server-2022]
  architectures: [x64]
risk_level: L1
capability:
  id: win.service.create
  version: "0.1.0"
  parameters: { setup_delay_ms: 750, post_operation_hold_ms: 1500 }
local_requirements:
  - { field: facts.service.create_succeeded, operator: equals, expected: true }
  - { field: facts.service.native_api, operator: equals, expected: CreateServiceW }
  - { field: facts.service.name, operator: present }
  - { field: facts.service.before.exists, operator: equals, expected: false }
  - { field: facts.service.after.exists, operator: equals, expected: true }
  - { field: facts.service.after.display_name, operator: equals, expected_from_local: facts.service.display_name }
  - { field: facts.service.after.binary_path, operator: equals, expected_from_local: facts.service.binary_path, normalizers: [windows_path] }
  - { field: facts.service.after.start_type, operator: equals, expected: disabled }
  - { field: facts.service.after.account, operator: equals, expected: LocalSystem, normalizers: [lowercase] }
  - { field: facts.service.after.service_type, operator: equals, expected: win32_own_process }
  - { field: facts.service.after.state, operator: equals, expected: stopped }
  - { field: facts.service.actor_pid, operator: present }
correlation:
  time_before_seconds: 60
  time_after_seconds: 300
  max_time_difference_ms: 25
  anchors:
    - { local_field: facts.service.name, cloud_field: service.name, strength: strong, normalizers: [lowercase, trim] }
    - { local_field: facts.service.actor_executable, cloud_field: process.executable, strength: strong, normalizers: [windows_path] }
    - { local_field: facts.service.actor_pid, cloud_field: process.pid, strength: medium }
method_selection: { strategy: best }
cloud_expectations:
  - id: service-create-api-hook
    method: { id: scm_api_hook, title: SCM CreateService API Hook }
    event_type: service_api
    event_actions: [create]
    cardinality: { min: 1, max: 3 }
    correlation:
      time_from_local: facts.service.occurred_at_utc
      max_time_difference_ms: 25
      anchors:
        - { local_field: facts.service.name, cloud_field: service.name, strength: strong, normalizers: [lowercase, trim] }
    assertions:
      - { field: event.action, operator: equals, expected: create, severity: required }
      - { field: service.name, operator: equals, expected_from_local: facts.service.name, severity: required, normalizers: [lowercase, trim] }
      - { field: process.pid, operator: equals, expected_from_local: facts.service.actor_pid, severity: required }
      - { field: process.executable, operator: equals, expected_from_local: facts.service.actor_executable, severity: required, normalizers: [windows_path] }
      - { field: service.binary_path, operator: present, severity: required }
      - { field: service.start_type, operator: present, severity: required }
      - { field: process.command_line, operator: contains, expected_from_local: facts.service.name, severity: informational }
      - { field: service.display_name, operator: present, severity: informational }
      - { field: service.account, operator: present, severity: informational }
      - { field: service.service_type, operator: present, severity: informational }
  - id: service-create-system-7045
    method: { id: system_event_7045, title: Windows System 7045 }
    event_type: service
    event_actions: [create]
    cardinality: { min: 1, max: 3 }
    correlation:
      time_from_local: facts.service.occurred_at_utc
      anchors:
        - { local_field: facts.service.name, cloud_field: service.name, strength: strong, normalizers: [lowercase, trim] }
    assertions:
      - { field: event.action, operator: equals, expected: create, severity: required }
      - { field: service.name, operator: equals, expected_from_local: facts.service.name, severity: required, normalizers: [lowercase, trim] }
      - { field: service.binary_path, operator: present, severity: required }
      - { field: winlog.event_id, operator: equals, expected: 7045, severity: required }
      - { field: service.start_type, operator: present, severity: recommended }
      - { field: service.account, operator: present, severity: recommended }
      - { field: service.service_type, operator: present, severity: recommended }
      - field: process.executable
        operator: equals
        expected_from_local: facts.service.actor_executable
        accepted_values:
          - { value: 'C:\Windows\System32\services.exe', message: EDR 仅保留 Service Control Manager 服务侧调用链，需要补充客户端调用链 }
          - { value: 'C:\Windows\System32\svchost.exe', message: EDR 仅保留系统服务侧调用链，需要补充客户端调用链 }
        severity: recommended
        normalizers: [windows_path]
scoring: { weight: 1.0, required_field_weight: 1.0, recommended_field_weight: 0.25 }
metadata:
  owner: edr-validation-team
  status: active
  change_reason: 260814202100 实测 Action.Name=CreateService；EDR Common.EventTime 相对本地 service.occurred_at_utc 为 +20.914 ms，而相对 completed_at_utc 为 -162.651 ms，因此 API Hook 改用调用开始时间并采用 25 ms 强证据。Child 仅稳定提供 ServiceName、FilePath、ProcCmdline、StartType，未提供 DisplayName、Account、ServiceType。
  references: [reference/260814202100run, Microsoft CreateServiceW, Windows System Event 7045, Tencent EDR ServiceEvents]
