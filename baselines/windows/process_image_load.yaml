  - field: facts.process.image_load.application_private_unsigned_native.export_resolved
    operator: equals
    expected: true
  - field: facts.process.image_load.application_private_unsigned_native.export_invoked
    operator: equals
    expected: true
  - field: facts.process.image_load.application_private_unsigned_native.export_result
    operator: present
  - field: facts.process.image_load.application_private_unsigned_native.occurred_at_utc
    operator: present
