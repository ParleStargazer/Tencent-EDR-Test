      anchors:
        - local_field: facts.process.image_load.application_local_loadlibrary.path
          cloud_field: file.path
          strength: strong
          normalizers: [windows_path]
        - local_field: facts.process.image_load.application_local_loadlibrary.file_name
          cloud_field: file.name
          strength: strong
          normalizers: [lowercase]
        - local_field: programs.target.pid
          cloud_field: process.pid
          strength: medium
    assertions:
      - field: process.pid
        operator: equals
        expected_from_local: programs.target.pid
        severity: required
      - field: process.executable
        operator: equals
        expected_from_local: programs.target.executable
        severity: required
        normalizers: [windows_path]
      - field: file.path
        operator: equals
        expected_from_local: facts.process.image_load.application_local_loadlibrary.path
        severity: required
        normalizers: [windows_path]
  - id: application-local-loadlibraryex-event
    method: { id: application-local-loadlibraryex, title: 应用目录 DLL · LoadLibraryExW }
    event_type: process
    event_actions: [image_load]
    cardinality: { min: 1, max: 3 }
    correlation:
      time_from_local: facts.process.image_load.application_local_loadlibrary_ex.occurred_at_utc
      anchors:
        - local_field: facts.process.image_load.application_local_loadlibrary_ex.path
          cloud_field: file.path
          strength: strong
          normalizers: [windows_path]
        - local_field: facts.process.image_load.application_local_loadlibrary_ex.file_name
          cloud_field: file.name
          strength: strong
          normalizers: [lowercase]
        - local_field: programs.target.pid
          cloud_field: process.pid
          strength: medium
    assertions:
      - field: process.pid
        operator: equals
        expected_from_local: programs.target.pid
        severity: required
      - field: process.executable
        operator: equals
        expected_from_local: programs.target.executable
        severity: required
        normalizers: [windows_path]
      - field: file.path
        operator: equals
        expected_from_local: facts.process.image_load.application_local_loadlibrary_ex.path
        severity: required
        normalizers: [windows_path]
  - id: managed-assembly-load-event
    method: { id: managed-assembly-load-context, title: 托管程序集 · AssemblyLoadContext }
    event_type: process
    event_actions: [image_load]
    cardinality: { min: 1, max: 3 }
    correlation:
      time_from_local: facts.process.image_load.managed_assembly_load_context.occurred_at_utc
      anchors:
        - local_field: facts.process.image_load.managed_assembly_load_context.path
          cloud_field: file.path
          strength: strong
          normalizers: [windows_path]
        - local_field: facts.process.image_load.managed_assembly_load_context.file_name
          cloud_field: file.name
          strength: strong
          normalizers: [lowercase]
        - local_field: programs.helper.pid
          cloud_field: process.pid
          strength: medium
    assertions:
      - field: process.pid
        operator: equals
        expected_from_local: programs.helper.pid
        severity: required
      - field: process.executable
        operator: equals
        expected_from_local: programs.helper.executable
        severity: required
        normalizers: [windows_path]
      - field: file.path
