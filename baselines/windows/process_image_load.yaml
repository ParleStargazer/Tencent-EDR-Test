schema_version: "1.1"
baseline_id: win.process.image_load
version: "0.4.1"
title: Windows 镜像或动态库加载遥测
description: 验证三个微软 DLL 加载方法、一个应用私有无签名原生 DLL 加载并调用导出的方法，以及一个 dotnet 托管程序集加载方法；五个方法独立比较并保留结果。
platform:
  os: windows
  versions: [windows-10, windows-11, windows-server-2019, windows-server-2022]
  architectures: [x64]
risk_level: L0
capability:
  id: win.process.image_load
  version: "0.4.1"
  parameters:
    library_name: winhttp.dll
    application_local_library_name: version.dll
    loadlibraryex_library_name: dbghelp.dll
local_requirements:
  - field: facts.process.image_load_succeeded
    operator: equals
    expected: true
  - field: facts.process.image_load_subtest_count
    operator: equals
    expected: 5
  - field: facts.process.image_load.system_loadlibrary.succeeded
    operator: equals
    expected: true
  - field: facts.process.image_load.system_loadlibrary.path
    operator: present
  - field: facts.process.image_load.system_loadlibrary.occurred_at_utc
    operator: present
  - field: facts.process.image_load.application_local_loadlibrary.succeeded
    operator: equals
    expected: true
  - field: facts.process.image_load.application_local_loadlibrary.path
    operator: present
  - field: facts.process.image_load.application_local_loadlibrary.occurred_at_utc
    operator: present
  - field: facts.process.image_load.application_local_loadlibrary_ex.succeeded
    operator: equals
    expected: true
  - field: facts.process.image_load.application_local_loadlibrary_ex.path
    operator: present
  - field: facts.process.image_load.application_local_loadlibrary_ex.occurred_at_utc
    operator: present
  - field: facts.process.image_load.application_private_unsigned_native.succeeded
    operator: equals
    expected: true
  - field: facts.process.image_load.application_private_unsigned_native.path
    operator: present
  - field: facts.process.image_load.application_private_unsigned_native.file_name
    operator: present
  - field: facts.process.image_load.application_private_unsigned_native.target_pid
    operator: present
  - field: facts.process.image_load.application_private_unsigned_native.target_executable
    operator: present
  - field: facts.process.image_load.application_private_unsigned_native.sha256
    operator: present
  - field: facts.process.image_load.application_private_unsigned_native.export_name
    operator: equals
