schema_version: "1.1"
baseline_id: win.process.image_load
version: "0.3.1"
title: Windows 镜像或动态库加载遥测
description: 验证三个原生 DLL 加载子项和一个复现腾讯 EDR 0807 LoadDll 事件形态的 dotnet 托管程序集加载子项。
platform:
  os: windows
  versions: [windows-10, windows-11, windows-server-2019, windows-server-2022]
  architectures: [x64]
risk_level: L0
capability:
  id: win.process.image_load
  version: "0.3.0"
  parameters:
    library_name: winhttp.dll
    application_local_library_name: version.dll
    loadlibraryex_library_name: dbghelp.dll
    inter_subtest_delay_ms: 750
local_requirements:
  - field: facts.process.image_load_succeeded
    operator: equals
    expected: true
  - field: facts.process.image_load_subtest_count
    operator: equals
    expected: 4
  - field: facts.process.image_load.system_loadlibrary.succeeded
    operator: equals
    expected: true
  - field: facts.process.image_load.system_loadlibrary.path
    operator: present
  - field: facts.process.image_load.system_loadlibrary.occurred_at_utc
    operator: present
  - field: facts.process.image_load.application_local_loadlibrary.succeeded
    operator: equals
    expected: true
  - field: facts.process.image_load.application_local_loadlibrary.path
    operator: present
  - field: facts.process.image_load.application_local_loadlibrary.occurred_at_utc
    operator: present
  - field: facts.process.image_load.application_local_loadlibrary_ex.succeeded
    operator: equals
    expected: true
  - field: facts.process.image_load.application_local_loadlibrary_ex.path
    operator: present
  - field: facts.process.image_load.application_local_loadlibrary_ex.occurred_at_utc
    operator: present
  - field: facts.process.image_load.managed_assembly_load_context.succeeded
    operator: equals
    expected: true
  - field: facts.process.image_load.managed_assembly_load_context.path
    operator: present
  - field: facts.process.image_load.managed_assembly_load_context.target_pid
    operator: present
  - field: facts.process.image_load.managed_assembly_load_context.occurred_at_utc
    operator: present
correlation:
  time_before_seconds: 60
  time_after_seconds: 300
  max_time_difference_ms: 15
  anchors:
    - local_field: programs.target.executable
      cloud_field: process.executable
      strength: strong
      normalizers: [windows_path]
    - local_field: programs.target.pid
      cloud_field: process.pid
      strength: medium
method_selection:
  strategy: best
cloud_expectations:
  - id: system-loadlibrary-event
    method: { id: system-loadlibrary, title: 系统目录 DLL · LoadLibraryW }
    event_type: process
    event_actions: [image_load]
    cardinality: { min: 1, max: 3 }
    correlation:
      time_from_local: facts.process.image_load.system_loadlibrary.occurred_at_utc
      anchors:
        - local_field: facts.process.image_load.system_loadlibrary.path
          cloud_field: file.path
          strength: strong
          normalizers: [windows_path]
        - local_field: facts.process.image_load.system_loadlibrary.file_name
          cloud_field: file.name
          strength: strong
          normalizers: [lowercase]
        - local_field: programs.target.pid
          cloud_field: process.pid
          strength: medium
    assertions:
      - field: process.pid
        operator: equals
        expected_from_local: programs.target.pid
        severity: required
      - field: process.executable
        operator: equals
        expected_from_local: programs.target.executable
        severity: required
        normalizers: [windows_path]
      - field: file.path
        operator: equals
        expected_from_local: facts.process.image_load.system_loadlibrary.path
        severity: required
        normalizers: [windows_path]
  - id: application-local-loadlibrary-event
    method: { id: application-local-loadlibrary, title: 应用目录 DLL · LoadLibraryW }
    event_type: process
    event_actions: [image_load]
    cardinality: { min: 1, max: 3 }
    correlation:
      time_from_local: facts.process.image_load.application_local_loadlibrary.occurred_at_utc
      anchors:
        - local_field: facts.process.image_load.application_local_loadlibrary.path
          cloud_field: file.path
          strength: strong
          normalizers: [windows_path]
        - local_field: facts.process.image_load.application_local_loadlibrary.file_name
          cloud_field: file.name
          strength: strong
          normalizers: [lowercase]
        - local_field: programs.target.pid
          cloud_field: process.pid
          strength: medium
    assertions:
      - field: process.pid
        operator: equals
        expected_from_local: programs.target.pid
        severity: required
      - field: process.executable
        operator: equals
        expected_from_local: programs.target.executable
        severity: required
        normalizers: [windows_path]
      - field: file.path
        operator: equals
        expected_from_local: facts.process.image_load.application_local_loadlibrary.path
        severity: required
        normalizers: [windows_path]
  - id: application-local-loadlibraryex-event
    method: { id: application-local-loadlibraryex, title: 应用目录 DLL · LoadLibraryExW }
    event_type: process
    event_actions: [image_load]
    cardinality: { min: 1, max: 3 }
    correlation:
      time_from_local: facts.process.image_load.application_local_loadlibrary_ex.occurred_at_utc
      anchors:
        - local_field: facts.process.image_load.application_local_loadlibrary_ex.path
          cloud_field: file.path
          strength: strong
          normalizers: [windows_path]
        - local_field: facts.process.image_load.application_local_loadlibrary_ex.file_name
          cloud_field: file.name
          strength: strong
          normalizers: [lowercase]
        - local_field: programs.target.pid
          cloud_field: process.pid
          strength: medium
    assertions:
      - field: process.pid
        operator: equals
        expected_from_local: programs.target.pid
        severity: required
      - field: process.executable
        operator: equals
        expected_from_local: programs.target.executable
        severity: required
        normalizers: [windows_path]
      - field: file.path
        operator: equals
        expected_from_local: facts.process.image_load.application_local_loadlibrary_ex.path
        severity: required
        normalizers: [windows_path]
  - id: managed-assembly-load-event
    method: { id: managed-assembly-load-context, title: 托管程序集 · AssemblyLoadContext }
    event_type: process
    event_actions: [image_load]
    cardinality: { min: 1, max: 3 }
    correlation:
      time_from_local: facts.process.image_load.managed_assembly_load_context.occurred_at_utc
      anchors:
        - local_field: facts.process.image_load.managed_assembly_load_context.path
          cloud_field: file.path
          strength: strong
          normalizers: [windows_path]
        - local_field: facts.process.image_load.managed_assembly_load_context.file_name
          cloud_field: file.name
          strength: strong
          normalizers: [lowercase]
        - local_field: programs.helper.pid
          cloud_field: process.pid
          strength: medium
    assertions:
      - field: process.pid
        operator: equals
        expected_from_local: programs.helper.pid
        severity: required
      - field: process.executable
        operator: equals
        expected_from_local: programs.helper.executable
        severity: required
        normalizers: [windows_path]
      - field: file.path
        operator: equals
        expected_from_local: facts.process.image_load.managed_assembly_load_context.path
        severity: required
        normalizers: [windows_path]
scoring: { weight: 1.0, required_field_weight: 1.0, recommended_field_weight: 0.25 }
metadata:
  owner: edr-validation-team
  status: draft
  change_reason: 四种加载方法分别判定，能力结论默认采用 EDR 遥测结果最好的方法；所有方法仍保留完整条件、候选和状态。
  references: [EDR-Telemetry / Windows / Process Activity / Image Library Loaded]
