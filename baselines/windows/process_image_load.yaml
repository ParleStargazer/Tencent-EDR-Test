      - field: process.pid
        operator: equals
        expected_from_local: facts.process.image_load.application_private_unsigned_native.target_pid
        severity: required
      - field: process.executable
        operator: equals
        expected_from_local: facts.process.image_load.application_private_unsigned_native.target_executable
        severity: required
        normalizers: [windows_path]
      - field: file.path
        operator: equals
        expected_from_local: facts.process.image_load.application_private_unsigned_native.path
        severity: required
        normalizers: [windows_path]
      - { field: file.hash.md5, operator: present, severity: recommended }
      - { field: image.base_address, operator: present, severity: recommended }
      - { field: image.size_bytes, operator: present, severity: recommended }
scoring: { weight: 1.0, required_field_weight: 1.0, recommended_field_weight: 0.25 }
metadata:
  owner: edr-validation-team
  status: active
  change_reason: 20260823 两轮实测中，应用私有 e_sqlite3 的 LoadDll 记录与本地 PID、完整路径精确一致，但 Common.EventTime 相对调用前时间分别为 +64.637 ms、+59.184 ms；同路径文件复制事件仅约 -3 ms，排除整机时钟偏移。样本现记录 LoadLibrary 调用起止时间，并以测试机上受 EDR Hook 影响后的调用返回时刻作为成功装载事件及强时间关联锚点，继续严格使用全局 15 ms 基准。
  references: [reference/load_dll/edr_LoadDll.json, reference/EDR日志-字段表.txt, Tencent EDR ModuleEvents / LoadDll]
