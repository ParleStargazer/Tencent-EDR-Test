schema_version: "1.1"
baseline_id: win.scheduled_task.modify
version: "0.3.0"
title: Windows 计划任务修改遥测
description: 以 Task Scheduler COM/RPC Hook 和受控 Windows 安全审计 XML 覆盖更新作为两个独立方法；后者必须在本机生成 4702，腾讯云端应映射为 SchedTaskUpdate，并以任务路径、更新后 XML 标记和安全事件时间形成直接证据。
platform:
  os: windows
  versions: [windows-10, windows-11, windows-server-2019, windows-server-2022]
  architectures: [x64]
risk_level: L2
capability:
  id: win.scheduled_task.modify
  version: "0.3.0"
  parameters: { post_operation_hold_ms: 1500 }
local_requirements:
  - { field: facts.scheduled_task.modify_succeeded, operator: equals, expected: true }
  - { field: facts.scheduled_task.task_scheduler_com.modify_succeeded, operator: equals, expected: true }
  - { field: facts.scheduled_task.task_scheduler_com.task_path, operator: present }
  - { field: facts.scheduled_task.task_scheduler_com.before.exists, operator: equals, expected: true }
  - { field: facts.scheduled_task.task_scheduler_com.before.xml_sha256, operator: present }
  - { field: facts.scheduled_task.task_scheduler_com.after.exists, operator: equals, expected: true }
  - { field: facts.scheduled_task.task_scheduler_com.after.xml_sha256, operator: present }
  - { field: facts.scheduled_task.task_scheduler_com.after.marker, operator: equals, expected_from_local: facts.scheduled_task.task_scheduler_com.marker }
  - { field: facts.scheduled_task.task_scheduler_com.actor_pid, operator: present }
  - { field: facts.scheduled_task.security_audit_update.modify_succeeded, operator: equals, expected: true }
  - { field: facts.scheduled_task.security_audit_update.task_path, operator: present }
  - { field: facts.scheduled_task.security_audit_update.before.exists, operator: equals, expected: true }
  - { field: facts.scheduled_task.security_audit_update.before.xml_sha256, operator: present }
  - { field: facts.scheduled_task.security_audit_update.before.enabled, operator: equals, expected: false }
  - { field: facts.scheduled_task.security_audit_update.after.exists, operator: equals, expected: true }
  - { field: facts.scheduled_task.security_audit_update.after.xml_sha256, operator: present }
  - { field: facts.scheduled_task.security_audit_update.after.enabled, operator: equals, expected: true }
  - { field: facts.scheduled_task.security_audit_update.after.triggers, operator: contains, expected: TimeTrigger }
  - { field: facts.scheduled_task.security_audit_update.after.marker, operator: equals, expected_from_local: facts.scheduled_task.security_audit_update.marker }
  - { field: facts.scheduled_task.security_audit_update.actor_pid, operator: present }
  - { field: facts.scheduled_task.security_audit_update.security_event_id, operator: equals, expected: 4702 }
  - { field: facts.scheduled_task.security_audit_update.security_event_found, operator: equals, expected: true }
  - { field: facts.scheduled_task.security_audit_update.security_event_occurred_at_utc, operator: present }
  - { field: facts.scheduled_task.security_audit_update.security_event_record_id, operator: present }
  - { field: facts.scheduled_task.security_audit_update.audit_success_enabled, operator: equals, expected: true }
  - { field: facts.scheduled_task.security_audit_update.audit_policy_restore_succeeded, operator: equals, expected: true }
correlation:
  time_before_seconds: 60
  time_after_seconds: 300
  max_time_difference_ms: 15
  anchors:
    - { local_field: facts.scheduled_task.security_audit_update.task_path, cloud_field: scheduled_task.name, strength: strong, normalizers: [lowercase, trim] }
    - { local_field: facts.scheduled_task.security_audit_update.actor_executable, cloud_field: process.executable, strength: medium, normalizers: [windows_path] }
method_selection: { strategy: best }
cloud_expectations:
  - id: scheduled-task-modify-register-rpc-hook-event
    method: { id: task_scheduler_com, title: Task Scheduler COM 更新（RPC Hook） }
    event_type: scheduled_task_rpc
    event_actions: [register]
    cardinality: { min: 1, max: 10 }
    correlation:
      time_from_local: facts.scheduled_task.task_scheduler_com.correlation_at_utc
      anchors:
        - { local_field: facts.scheduled_task.task_scheduler_com.task_path, cloud_field: scheduled_task.name, strength: strong, normalizers: [lowercase, trim] }
        - { local_field: facts.scheduled_task.task_scheduler_com.actor_executable, cloud_field: process.executable, strength: strong, normalizers: [windows_path] }
        - { local_field: facts.scheduled_task.task_scheduler_com.actor_pid, cloud_field: process.pid, strength: medium }
    assertions:
      - { field: scheduled_task.name, operator: equals, expected_from_local: facts.scheduled_task.task_scheduler_com.task_path, severity: required, normalizers: [lowercase, trim] }
      - { field: process.pid, operator: equals, expected_from_local: facts.scheduled_task.task_scheduler_com.actor_pid, severity: required }
      - { field: process.executable, operator: equals, expected_from_local: facts.scheduled_task.task_scheduler_com.actor_executable, severity: required, normalizers: [windows_path] }
      - { field: scheduled_task.command, operator: equals, expected_from_local: facts.scheduled_task.task_scheduler_com.after.action_command, severity: recommended, normalizers: [windows_path] }
      - { field: scheduled_task.arguments, operator: equals, expected_from_local: facts.scheduled_task.task_scheduler_com.after.action_arguments, severity: recommended }
  - id: scheduled-task-modify-security-audit-event
    method: { id: security_audit_update, title: Windows 安全审计 XML 覆盖更新（4702） }
    event_type: scheduled_task
    event_actions: [modify]
    cardinality: { min: 1, max: 10 }
    correlation:
      time_from_local: facts.scheduled_task.security_audit_update.security_event_occurred_at_utc
      anchors:
        - { local_field: facts.scheduled_task.security_audit_update.task_path, cloud_field: scheduled_task.name, strength: strong, normalizers: [lowercase, trim] }
        - { local_field: facts.scheduled_task.security_audit_update.actor_executable, cloud_field: process.executable, strength: medium, normalizers: [windows_path] }
    assertions:
      - { field: scheduled_task.name, operator: equals, expected_from_local: facts.scheduled_task.security_audit_update.task_path, severity: required, normalizers: [lowercase, trim] }
      - { field: scheduled_task.content, operator: contains, expected_from_local: facts.scheduled_task.security_audit_update.marker, severity: required }
      - { field: scheduled_task.content, operator: contains, expected_from_local: facts.scheduled_task.security_audit_update.after.action_arguments, severity: required }
      - { field: winlog.event_id, operator: equals, expected: 4702, severity: required }
      - { field: process.executable, operator: present, severity: recommended }
      - { field: process.command_line, operator: present, severity: recommended }
      - { field: user.id, operator: present, severity: recommended }
scoring: { weight: 1.0, required_field_weight: 1.0, recommended_field_weight: 0.25 }
metadata:
  owner: edr-validation-team
  status: active
  change_reason: reference/scheduled_task 的 887 条 SchedTaskUpdate 均为 ScheduleTaskEvents/WinEventLog/4702，更新后的完整 XML 位于 Child.TaskContentNew。旧 /Change /ENABLE 方法不保证本机审核事件存在，现改为在受控审核窗口内用 /Create /XML /F 覆盖完整定义，并直接关联本机 4702 时间。
  references: [reference/scheduled_task/edr_SchedTaskUpdate.json, Windows Security Event 4702, Tencent EDR SchedTaskUpdate]
