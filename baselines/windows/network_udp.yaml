schema_version: "1.1"
baseline_id: win.network.udp
version: "0.2.0"
title: Windows UDP 连接遥测
description: 以本机 Actor 与受控 UDP Helper 交叉确认的数据报端点为绝对基准；按 260809213600run 实测的 NetBind 导出字段验证 Actor、UDP 协议和预绑定源端点。
platform:
  os: windows
  versions: [windows-10, windows-11, windows-server-2019, windows-server-2022]
  architectures: [x64]
risk_level: L0
capability:
  id: win.network.udp
  version: "0.1.0"
  parameters: { setup_delay_ms: 250, post_operation_hold_ms: 1500, payload_size: 8192 }
local_requirements:
  - { field: facts.network.udp_connect_succeeded, operator: equals, expected: true }
  - { field: facts.network.occurred_at_utc, operator: present }
  - { field: facts.network.actor_pid, operator: present }
  - { field: facts.network.actor_executable, operator: present }
  - { field: facts.network.local.port, operator: present }
  - { field: facts.network.remote.port, operator: present }
correlation:
  time_before_seconds: 60
  time_after_seconds: 300
  max_time_difference_ms: 15
  anchors:
    - { local_field: facts.network.actor_executable, cloud_field: process.executable, strength: strong, normalizers: [windows_path] }
    - { local_field: facts.network.actor_pid, cloud_field: process.pid, strength: medium }
    - { local_field: facts.network.actor_command_line, cloud_field: process.command_line, strength: medium }
cloud_expectations:
  - id: udp-connection-event
    event_type: network
    event_actions: [udp_connect]
    cardinality: { min: 1 }
    correlation:
      time_from_local: facts.network.occurred_at_utc
      anchors:
        - { local_field: facts.network.actor_pid, cloud_field: process.pid, strength: medium }
    assertions:
      - { field: process.pid, operator: equals, expected_from_local: facts.network.actor_pid, severity: required }
      - { field: process.executable, operator: equals, expected_from_local: facts.network.actor_executable, severity: required, normalizers: [windows_path] }
      - { field: network.transport, operator: equals, expected: udp, severity: required, normalizers: [lowercase] }
      - { field: network.source_ip, operator: equals, expected: 0.0.0.0, severity: required }
      - { field: network.source_port, operator: equals, expected: 0, severity: required }
      - { field: network.endpoint_name, operator: equals, expected: "udp_0.0.0.0:0", severity: recommended, normalizers: [lowercase] }
      - { field: event.provider, operator: equals, expected: KernelMon, severity: recommended }
scoring: { weight: 1.0, required_field_weight: 1.0, recommended_field_weight: 0.25 }
metadata:
  owner: edr-validation-team
  status: active
  change_reason: 参考 260809213600run，仅校准 UDP 可直接抓取的 NetBind 字段；目的端点继续保留为本地事实，不作为当前腾讯导出的必需字段。
  references: [Tencent EDR NetworkEvents / NetBind / 260809213600run]
