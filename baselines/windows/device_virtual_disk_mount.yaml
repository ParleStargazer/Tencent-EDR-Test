schema_version: "1.1"
baseline_id: win.device.virtual_disk.mount
version: "0.1.1"
title: Windows 虚拟磁盘挂载遥测
description: 同轮分别通过 Mount-DiskImage 和 VirtDisk 原生 API 挂载两个唯一、只读且不分配盘符的动态 VHD。当前腾讯 EDR 没有已知虚拟磁盘专属字段或动作，因此本地绝对基准必须完整通过，云端比较允许保持未匹配，但普通进程、PowerShell 或文件事件不能冒充虚拟磁盘挂载能力。
platform:
  os: windows
  versions: [windows-10, windows-11, windows-server-2019, windows-server-2022]
  architectures: [x64]
risk_level: L2
capability:
  id: win.device.virtual_disk.mount
  version: "0.1.1"
  parameters: { post_operation_hold_ms: 1000 }
local_requirements:
  - { field: facts.virtual_disk.mount_succeeded, operator: equals, expected: true }
  - { field: facts.virtual_disk.vdisk_powershell.succeeded, operator: equals, expected: true }
  - { field: facts.virtual_disk.vdisk_powershell.method, operator: equals, expected: VDISK_POWERSHELL }
  - { field: facts.virtual_disk.vdisk_powershell.invocation_kind, operator: equals, expected: powershell_mount_disk_image }
  - { field: facts.virtual_disk.vdisk_powershell.occurred_at_utc, operator: present }
  - { field: facts.virtual_disk.vdisk_powershell.image_path, operator: present }
  - { field: facts.virtual_disk.vdisk_powershell.image_sha256, operator: regex, expected: "^[0-9a-f]{64}$" }
  - { field: facts.virtual_disk.vdisk_powershell.image_location_strategy, operator: present }
  - { field: facts.virtual_disk.vdisk_powershell.image_directory_compressed, operator: equals, expected: false }
  - { field: facts.virtual_disk.vdisk_powershell.image_directory_encrypted, operator: equals, expected: false }
  - { field: facts.virtual_disk.vdisk_powershell.create_retry_used, operator: present }
  - { field: facts.virtual_disk.vdisk_powershell.virtual_size_bytes, operator: equals, expected: 16777216 }
  - { field: facts.virtual_disk.vdisk_powershell.physical_path, operator: present }
  - { field: facts.virtual_disk.vdisk_powershell.read_only, operator: equals, expected: true }
  - { field: facts.virtual_disk.vdisk_powershell.no_drive_letter, operator: equals, expected: true }
  - { field: facts.virtual_disk.vdisk_powershell.actor_attach_verified, operator: equals, expected: true }
  - { field: facts.virtual_disk.vdisk_powershell.controller_attach_verified, operator: equals, expected: true }
  - { field: facts.virtual_disk.vdisk_powershell.actor_detach_verified, operator: equals, expected: true }
  - { field: facts.virtual_disk.vdisk_powershell.controller_detach_verified, operator: equals, expected: true }
  - { field: facts.virtual_disk.vdisk_powershell.initiator_pid, operator: present }
  - { field: facts.virtual_disk.vdisk_powershell.initiator_executable, operator: present }
  - { field: facts.virtual_disk.vdisk_powershell.initiator_command_line, operator: contains, expected: Mount-DiskImage }
  - { field: facts.virtual_disk.vdisk_native_api.succeeded, operator: equals, expected: true }
  - { field: facts.virtual_disk.vdisk_native_api.method, operator: equals, expected: VDISK_NATIVE_API }
  - { field: facts.virtual_disk.vdisk_native_api.invocation_kind, operator: equals, expected: virtdisk_native_api }
  - { field: facts.virtual_disk.vdisk_native_api.occurred_at_utc, operator: present }
  - { field: facts.virtual_disk.vdisk_native_api.image_path, operator: present }
  - { field: facts.virtual_disk.vdisk_native_api.image_sha256, operator: regex, expected: "^[0-9a-f]{64}$" }
  - { field: facts.virtual_disk.vdisk_native_api.image_location_strategy, operator: present }
  - { field: facts.virtual_disk.vdisk_native_api.image_directory_compressed, operator: equals, expected: false }
  - { field: facts.virtual_disk.vdisk_native_api.image_directory_encrypted, operator: equals, expected: false }
  - { field: facts.virtual_disk.vdisk_native_api.create_retry_used, operator: present }
  - { field: facts.virtual_disk.vdisk_native_api.virtual_size_bytes, operator: equals, expected: 16777216 }
  - { field: facts.virtual_disk.vdisk_native_api.physical_path, operator: present }
  - { field: facts.virtual_disk.vdisk_native_api.read_only, operator: equals, expected: true }
  - { field: facts.virtual_disk.vdisk_native_api.no_drive_letter, operator: equals, expected: true }
  - { field: facts.virtual_disk.vdisk_native_api.actor_attach_verified, operator: equals, expected: true }
  - { field: facts.virtual_disk.vdisk_native_api.controller_attach_verified, operator: equals, expected: true }
  - { field: facts.virtual_disk.vdisk_native_api.actor_detach_verified, operator: equals, expected: true }
  - { field: facts.virtual_disk.vdisk_native_api.controller_detach_verified, operator: equals, expected: true }
  - { field: facts.virtual_disk.vdisk_native_api.initiator_pid, operator: present }
  - { field: facts.virtual_disk.vdisk_native_api.initiator_executable, operator: present }
  - { field: facts.virtual_disk.vdisk_native_api.initiator_command_line, operator: present }
correlation:
  time_before_seconds: 60
  time_after_seconds: 300
  max_time_difference_ms: 15
  anchors:
    - { local_field: facts.virtual_disk.vdisk_native_api.image_path, cloud_field: device.image_path, strength: strong, normalizers: [windows_path] }
    - { local_field: facts.virtual_disk.vdisk_native_api.physical_path, cloud_field: device.physical_path, strength: strong, normalizers: [windows_path] }
    - { local_field: facts.virtual_disk.vdisk_native_api.initiator_executable, cloud_field: process.executable, strength: medium, normalizers: [windows_path] }
method_selection: { strategy: best }
cloud_expectations:
  - id: virtual-disk-mount-via-powershell
    method: { id: VDISK_POWERSHELL, title: Mount-DiskImage }
    event_type: device
    event_actions: [virtual_disk_mount]
    cardinality: { min: 1, max: 20 }
    correlation:
      time_from_local: facts.virtual_disk.vdisk_powershell.occurred_at_utc
      max_time_difference_ms: 15
      anchors:
        - { local_field: facts.virtual_disk.vdisk_powershell.image_path, cloud_field: device.image_path, strength: strong, normalizers: [windows_path] }
        - { local_field: facts.virtual_disk.vdisk_powershell.physical_path, cloud_field: device.physical_path, strength: strong, normalizers: [windows_path] }
        - { local_field: facts.virtual_disk.vdisk_powershell.image_sha256, cloud_field: device.image_sha256, strength: strong, normalizers: [lowercase, trim] }
        - { local_field: facts.virtual_disk.vdisk_powershell.initiator_executable, cloud_field: process.executable, strength: medium, normalizers: [windows_path] }
    assertions:
      - { field: device.type, operator: equals, expected: virtual_disk, severity: required }
      - { field: device.image_path, operator: equals, expected_from_local: facts.virtual_disk.vdisk_powershell.image_path, severity: required, normalizers: [windows_path] }
      - { field: device.physical_path, operator: equals, expected_from_local: facts.virtual_disk.vdisk_powershell.physical_path, severity: required, normalizers: [windows_path] }
      - { field: device.image_sha256, operator: equals, expected_from_local: facts.virtual_disk.vdisk_powershell.image_sha256, severity: recommended, normalizers: [lowercase, trim] }
      - { field: device.virtual_size_bytes, operator: equals, expected_from_local: facts.virtual_disk.vdisk_powershell.virtual_size_bytes, severity: recommended }
      - { field: device.read_only, operator: equals, expected: true, severity: recommended }
      - { field: device.no_drive_letter, operator: equals, expected: true, severity: recommended }
      - { field: device.method, operator: equals, expected: VDISK_POWERSHELL, severity: recommended }
      - { field: process.executable, operator: equals, expected_from_local: facts.virtual_disk.vdisk_powershell.initiator_executable, severity: recommended, normalizers: [windows_path] }
      - { field: process.command_line, operator: contains, expected: Mount-DiskImage, severity: informational }
  - id: virtual-disk-mount-via-native-api
    method: { id: VDISK_NATIVE_API, title: OpenVirtualDisk + AttachVirtualDisk }
    event_type: device
    event_actions: [virtual_disk_mount]
    cardinality: { min: 1, max: 20 }
    correlation:
      time_from_local: facts.virtual_disk.vdisk_native_api.occurred_at_utc
      max_time_difference_ms: 15
      anchors:
        - { local_field: facts.virtual_disk.vdisk_native_api.image_path, cloud_field: device.image_path, strength: strong, normalizers: [windows_path] }
        - { local_field: facts.virtual_disk.vdisk_native_api.physical_path, cloud_field: device.physical_path, strength: strong, normalizers: [windows_path] }
        - { local_field: facts.virtual_disk.vdisk_native_api.image_sha256, cloud_field: device.image_sha256, strength: strong, normalizers: [lowercase, trim] }
        - { local_field: facts.virtual_disk.vdisk_native_api.initiator_executable, cloud_field: process.executable, strength: medium, normalizers: [windows_path] }
    assertions:
      - { field: device.type, operator: equals, expected: virtual_disk, severity: required }
      - { field: device.image_path, operator: equals, expected_from_local: facts.virtual_disk.vdisk_native_api.image_path, severity: required, normalizers: [windows_path] }
      - { field: device.physical_path, operator: equals, expected_from_local: facts.virtual_disk.vdisk_native_api.physical_path, severity: required, normalizers: [windows_path] }
      - { field: device.image_sha256, operator: equals, expected_from_local: facts.virtual_disk.vdisk_native_api.image_sha256, severity: recommended, normalizers: [lowercase, trim] }
      - { field: device.virtual_size_bytes, operator: equals, expected_from_local: facts.virtual_disk.vdisk_native_api.virtual_size_bytes, severity: recommended }
      - { field: device.read_only, operator: equals, expected: true, severity: recommended }
      - { field: device.no_drive_letter, operator: equals, expected: true, severity: recommended }
      - { field: device.method, operator: equals, expected: VDISK_NATIVE_API, severity: recommended }
      - { field: process.executable, operator: equals, expected_from_local: facts.virtual_disk.vdisk_native_api.initiator_executable, severity: recommended, normalizers: [windows_path] }
scoring: { weight: 1.0, required_field_weight: 1.0, recommended_field_weight: 0.25 }
metadata:
  owner: edr-validation-team
  status: draft
  change_reason: 当前腾讯 EDR 字段全集和已知运行日志均没有虚拟磁盘专属表、动作或对象字段。本基准完整定义未来直接 telemetry 应给出的镜像路径、物理设备路径、镜像摘要、容量、访问模式、挂载方式及发起进程；没有专属记录时保持未匹配结论。
  references:
    - docs/reference/tencent-edr-field-catalog.json
    - https://learn.microsoft.com/powershell/module/storage/mount-diskimage
    - https://learn.microsoft.com/windows/win32/api/virtdisk/nf-virtdisk-openvirtualdisk
    - https://learn.microsoft.com/windows/win32/api/virtdisk/nf-virtdisk-attachvirtualdisk
    - https://learn.microsoft.com/windows/win32/api/virtdisk/nf-virtdisk-getvirtualdiskphysicalpath
