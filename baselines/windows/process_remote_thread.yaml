schema_version: "1.1"
baseline_id: win.process.remote_thread
version: "0.1.0"
title: Windows 远程线程创建遥测
description: 验证 Actor 仅向本轮受控 Target 创建远程线程后，云端存在源、目标和线程标识。
platform:
  os: windows
  versions: [windows-10, windows-11, windows-server-2019, windows-server-2022]
  architectures: [x64]
risk_level: L2
capability:
  id: win.process.remote_thread
  version: "0.1.0"
  parameters:
    library_name: winhttp.dll
local_requirements:
  - field: facts.process.remote_thread_create_succeeded
    operator: equals
    expected: true
  - field: facts.process.thread_id
    operator: present
  - field: programs.target.command_line
    operator: contains
    expected: "${nonce}"
correlation:
  time_before_seconds: 60
  time_after_seconds: 300
  max_time_difference_ms: 10
  anchors:
    - local_field: programs.target.executable
      cloud_field: process.executable
      strength: strong
      normalizers: [windows_path]
    - local_field: programs.actor.executable
      cloud_field: source_process.executable
      strength: strong
      normalizers: [windows_path]
    - local_field: programs.target.pid
      cloud_field: process.pid
      strength: medium
cloud_expectations:
  - id: remote-thread-event
    event_type: process
    event_actions: [remote_thread_create]
    cardinality: { min: 1, max: 3 }
    assertions:
      - field: process.pid
        operator: equals
        expected_from_local: programs.target.pid
        severity: required
      - field: source_process.pid
        operator: equals
        expected_from_local: programs.actor.pid
        severity: required
      - field: thread.id
        operator: equals
        expected_from_local: facts.process.thread_id
        severity: recommended
scoring: { weight: 1.0, required_field_weight: 1.0, recommended_field_weight: 0.25 }
metadata:
  owner: edr-validation-team
  status: draft
  references: [EDR-Telemetry / Windows / Process Activity / Remote Thread Creation]
