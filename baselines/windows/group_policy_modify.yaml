schema_version: "1.1"
baseline_id: win.group_policy.modify
version: "0.2.0"
title: Windows 组策略修改遥测
description: 同轮执行隔离策略键控制组与真实白名单策略值同值回写；本地原始字节哈希、Actor 身份和紧邻 RegSetValueExW 的时间为绝对基准，并采用检出情况最佳的方法形成能力结论。
platform:
  os: windows
  versions: [windows-10, windows-11, windows-server-2019, windows-server-2022]
  architectures: [x64]
risk_level: L2
capability:
  id: win.group_policy.modify
  version: "0.2.0"
  parameters: { post_operation_hold_ms: 1500, known_policy_target: auto }
local_requirements:
  - { field: facts.group_policy.modify_succeeded, operator: equals, expected: true }
  - { field: facts.group_policy.isolated_policy_key.modify_succeeded, operator: equals, expected: true }
  - { field: facts.group_policy.isolated_policy_key.key_path, operator: present }
  - { field: facts.group_policy.isolated_policy_key.value_name, operator: equals, expected: ValidationMarker }
  - { field: facts.group_policy.isolated_policy_key.before.value_data_sha256, operator: present }
  - { field: facts.group_policy.isolated_policy_key.after.value_data_sha256, operator: present }
  - { field: facts.group_policy.isolated_policy_key.actor_pid, operator: present }
  - { field: facts.group_policy.known_policy_same_value.applicable, operator: equals, expected: true }
  - { field: facts.group_policy.known_policy_same_value.modify_succeeded, operator: equals, expected: true }
  - { field: facts.group_policy.known_policy_same_value.target_id, operator: present }
  - { field: facts.group_policy.known_policy_same_value.key_path, operator: present }
  - { field: facts.group_policy.known_policy_same_value.value_name, operator: present }
  - { field: facts.group_policy.known_policy_same_value.before.value_data_sha256, operator: present }
  - { field: facts.group_policy.known_policy_same_value.after.value_data_sha256, operator: equals, expected_from_local: facts.group_policy.known_policy_same_value.before.value_data_sha256 }
  - { field: facts.group_policy.known_policy_same_value.after.raw_data_length, operator: equals, expected_from_local: facts.group_policy.known_policy_same_value.before.raw_data_length }
  - { field: facts.group_policy.known_policy_same_value.actor_pid, operator: present }
  - { field: facts.group_policy.known_policy_same_value.actor_executable, operator: present }
correlation:
  time_before_seconds: 60
  time_after_seconds: 300
  max_time_difference_ms: 15
  anchors:
    - { local_field: facts.group_policy.known_policy_same_value.key_path, cloud_field: registry.key, strength: strong, normalizers: [registry_hive_path] }
    - { local_field: facts.group_policy.known_policy_same_value.value_name, cloud_field: registry.value_name, strength: strong, normalizers: [lowercase] }
    - { local_field: facts.group_policy.known_policy_same_value.actor_executable, cloud_field: process.executable, strength: strong, normalizers: [windows_path] }
    - { local_field: facts.group_policy.known_policy_same_value.actor_pid, cloud_field: process.pid, strength: medium }
method_selection: { strategy: best }
cloud_expectations:
  - id: group-policy-isolated-reg-set-value
    method: { id: isolated_policy_key, title: 隔离策略键控制组 }
    event_type: registry
    event_actions: [set_value]
    cardinality: { min: 1, max: 10 }
    correlation:
      time_from_local: facts.group_policy.isolated_policy_key.occurred_at_utc
      anchors:
        - { local_field: facts.group_policy.isolated_policy_key.key_path, cloud_field: registry.key, strength: strong, normalizers: [registry_hive_path] }
        - { local_field: facts.group_policy.isolated_policy_key.value_name, cloud_field: registry.value_name, strength: strong, normalizers: [lowercase] }
        - { local_field: facts.group_policy.isolated_policy_key.actor_executable, cloud_field: process.executable, strength: strong, normalizers: [windows_path] }
        - { local_field: facts.group_policy.isolated_policy_key.actor_pid, cloud_field: process.pid, strength: medium }
    assertions:
      - { field: registry.key, operator: equals, expected_from_local: facts.group_policy.isolated_policy_key.key_path, severity: required, normalizers: [registry_hive_path] }
      - { field: registry.value_name, operator: equals, expected_from_local: facts.group_policy.isolated_policy_key.value_name, severity: required, normalizers: [lowercase] }
      - { field: process.pid, operator: equals, expected_from_local: facts.group_policy.isolated_policy_key.actor_pid, severity: required }
      - { field: process.executable, operator: equals, expected_from_local: facts.group_policy.isolated_policy_key.actor_executable, severity: required, normalizers: [windows_path] }
      - { field: registry.old_value_data, operator: equals, expected_from_local: facts.group_policy.isolated_policy_key.before.value_data, severity: required }
      - { field: registry.value_data, operator: equals, expected_from_local: facts.group_policy.isolated_policy_key.after.value_data, severity: required }
      - { field: registry.value_type, operator: present, severity: required }
      - { field: registry.group_name, operator: equals, expected: 组策略, severity: required }
      - { field: registry.monitor_name, operator: equals, expected: 组策略, severity: required }
  - id: group-policy-known-same-value-reg-set-value
    method: { id: known_policy_same_value, title: 真实白名单策略值同值回写（L2） }
    event_type: registry
    event_actions: [set_value]
    cardinality: { min: 1, max: 10 }
    correlation:
      time_from_local: facts.group_policy.known_policy_same_value.occurred_at_utc
      anchors:
        - { local_field: facts.group_policy.known_policy_same_value.key_path, cloud_field: registry.key, strength: strong, normalizers: [registry_hive_path] }
        - { local_field: facts.group_policy.known_policy_same_value.value_name, cloud_field: registry.value_name, strength: strong, normalizers: [lowercase] }
        - { local_field: facts.group_policy.known_policy_same_value.actor_executable, cloud_field: process.executable, strength: strong, normalizers: [windows_path] }
        - { local_field: facts.group_policy.known_policy_same_value.actor_pid, cloud_field: process.pid, strength: medium }
    assertions:
      - { field: registry.key, operator: equals, expected_from_local: facts.group_policy.known_policy_same_value.key_path, severity: required, normalizers: [registry_hive_path] }
      - { field: registry.value_name, operator: equals, expected_from_local: facts.group_policy.known_policy_same_value.value_name, severity: required, normalizers: [lowercase] }
      - { field: process.pid, operator: equals, expected_from_local: facts.group_policy.known_policy_same_value.actor_pid, severity: required }
      - { field: process.executable, operator: equals, expected_from_local: facts.group_policy.known_policy_same_value.actor_executable, severity: required, normalizers: [windows_path] }
      - { field: registry.old_value_data, operator: equals, expected_from_local: facts.group_policy.known_policy_same_value.before.value_data, severity: required }
      - { field: registry.value_data, operator: equals, expected_from_local: facts.group_policy.known_policy_same_value.after.value_data, severity: required }
      - { field: registry.old_value_type, operator: present, severity: required }
      - { field: registry.value_type, operator: present, severity: required }
      - { field: registry.group_name, operator: equals, expected: 组策略, severity: required }
      - { field: registry.monitor_name, operator: equals, expected: 组策略, severity: required }
scoring: { weight: 1.0, required_field_weight: 1.0, recommended_field_weight: 0.25 }
metadata:
  owner: edr-validation-team
  status: active
  change_reason: 260820092000run 表明产品只对已知真实策略路径分类；新增仅针对已存在白名单值的同类型同原始字节回写，缺失时禁止创建。
  references: [reference/260820092000run, reference/260820092000run/edr_group_policy_reg_relate.json, Tencent EDR RegEvents / RegSetValue]
