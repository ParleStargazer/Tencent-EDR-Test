schema_version: "1.1"
baseline_id: win.file.create
version: "0.2.0"
title: Windows 文件创建遥测
description: 验证受控 Actor 创建唯一标记文件后，云端是否存在可关联的文件创建事件。
platform:
  os: windows
  versions:
    - windows-10
    - windows-11
    - windows-server-2019
    - windows-server-2022
  architectures:
    - x64
risk_level: L0
capability:
  id: win.file.create
  version: "0.1.0"
  parameters:
    target_root: "${environment.workspace_root}"
local_requirements:
  - field: facts.file.create_succeeded
    operator: equals
    expected: true
  - field: facts.file.path
    operator: present
  - field: facts.file.sha256
    operator: present
  - field: programs.actor.pid
    operator: present
correlation:
  time_before_seconds: 60
  time_after_seconds: 300
  anchors:
    - local_field: facts.file.path
      cloud_field: file.path
      strength: strong
      normalizers:
        - windows_path
    - local_field: programs.actor.pid
      cloud_field: process.pid
      strength: medium
cloud_expectations:
  - id: file-create-event
    event_type: file
    event_actions:
      - create
    cardinality:
      min: 1
      max: 5
    assertions:
      - field: file.path
        operator: equals
        expected_from_local: facts.file.path
        severity: required
        normalizers:
          - windows_path
      - field: process.pid
        operator: equals
        expected_from_local: programs.actor.pid
        severity: required
      - field: process.executable
        operator: present
        severity: required
      - field: user.id
        operator: present
        severity: recommended
      - field: file.hash.sha256
        operator: equals
        expected_from_local: facts.file.sha256
        severity: informational
scoring:
  weight: 1.0
  required_field_weight: 1.0
  recommended_field_weight: 0.25
metadata:
  owner: edr-validation-team
  status: draft
  change_reason: 调整为 SQLite 本地事实与用户导入云端 JSON 的离线比较模式。
  references:
    - EDR-Telemetry / Windows / File Manipulation / File Creation
