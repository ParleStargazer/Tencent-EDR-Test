schema_version: "1.1"
baseline_id: win.process.terminate
version: "0.1.0"
title: Windows 进程终止遥测
description: 验证 Actor 终止受控 Target 后，云端存在对应的进程终止事件和退出码。
platform:
  os: windows
  versions: [windows-10, windows-11, windows-server-2019, windows-server-2022]
  architectures: [x64]
risk_level: L1
capability:
  id: win.process.terminate
  version: "0.1.0"
  parameters:
    requested_exit_code: 197
local_requirements:
  - field: facts.process.terminate_succeeded
    operator: equals
    expected: true
  - field: programs.actor.command_line
    operator: contains
    expected: "${nonce}"
  - field: programs.target.pid
    operator: present
correlation:
  time_before_seconds: 60
  time_after_seconds: 300
  max_time_difference_ms: 10
  anchors:
    - local_field: programs.target.executable
      cloud_field: process.executable
      strength: strong
      normalizers: [windows_path]
    - local_field: programs.actor.executable
      cloud_field: source_process.executable
      strength: strong
      normalizers: [windows_path]
    - local_field: programs.target.pid
      cloud_field: process.pid
      strength: medium
cloud_expectations:
  - id: process-terminate-event
    event_type: process
    event_actions: [terminate]
    cardinality: { min: 1, max: 2 }
    assertions:
      - field: process.pid
        operator: equals
        expected_from_local: programs.target.pid
        severity: required
      - field: process.executable
        operator: equals
        expected_from_local: programs.target.executable
        severity: required
        normalizers: [windows_path]
      - field: process.exit_code
        operator: equals
        expected_from_local: facts.process.exit_code
        severity: recommended
      - field: source_process.executable
        operator: equals
        expected_from_local: programs.actor.executable
        severity: recommended
        normalizers: [windows_path]
scoring: { weight: 1.0, required_field_weight: 1.0, recommended_field_weight: 0.25 }
metadata:
  owner: edr-validation-team
  status: draft
  references: [EDR-Telemetry / Windows / Process Activity / Process Termination]
