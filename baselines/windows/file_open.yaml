schema_version: "1.1"
baseline_id: win.file.open
version: "0.2.0"
title: Windows 文件打开遥测
description: 同轮读写打开 TXT 与有效 JSON 文件并原样回写；本地验证两者，云端以 JSON 子项作为必检事件。
platform:
  os: windows
  versions: [windows-10, windows-11, windows-server-2019, windows-server-2022]
  architectures: [x64]
risk_level: L0
capability:
  id: win.file.open
  version: "0.2.0"
  parameters: { payload_size: 8192, post_operation_hold_ms: 1500 }
local_requirements:
  - { field: facts.file.open_succeeded, operator: equals, expected: true }
  - { field: facts.file.txt.open_succeeded, operator: equals, expected: true }
  - { field: facts.file.json.open_succeeded, operator: equals, expected: true }
  - { field: facts.file.json.extension, operator: equals, expected: ".json" }
  - { field: facts.file.json.path, operator: present }
  - { field: facts.file.json.before.md5, operator: present }
  - { field: facts.file.json.after.md5, operator: present }
  - { field: facts.file.json.after.size_bytes, operator: present }
  - { field: facts.file.json.open.content_unchanged, operator: equals, expected: true }
  - { field: facts.file.json.actor_pid, operator: present }
correlation:
  time_before_seconds: 60
  time_after_seconds: 300
  anchors:
    - { local_field: facts.file.json.path, cloud_field: file.path, strength: strong, normalizers: [windows_path] }
    - { local_field: facts.file.json.actor_executable, cloud_field: process.executable, strength: strong, normalizers: [windows_path] }
    - { local_field: facts.file.json.actor_pid, cloud_field: process.pid, strength: medium }
cloud_expectations:
  - id: file-open-json-event
    event_type: file
    event_actions: [open]
    cardinality: { min: 1, max: 5 }
    correlation:
      time_from_local: facts.file.json.occurred_at_utc
      anchors:
        - { local_field: facts.file.json.path, cloud_field: file.path, strength: strong, normalizers: [windows_path] }
        - { local_field: facts.file.json.actor_pid, cloud_field: process.pid, strength: medium }
    assertions:
      - { field: file.path, operator: equals, expected_from_local: facts.file.json.path, severity: required, normalizers: [windows_path] }
      - { field: process.pid, operator: equals, expected_from_local: facts.file.json.actor_pid, severity: required }
      - { field: process.executable, operator: equals, expected_from_local: facts.file.json.actor_executable, severity: required, normalizers: [windows_path] }
      - { field: file.size, operator: equals, expected_from_local: facts.file.json.after.size_bytes, severity: required }
      - { field: file.hash.md5, operator: equals, expected_from_local: facts.file.json.after.md5, severity: recommended, normalizers: [lowercase] }
      - { field: file.operation_name, operator: equals, expected: open_existing, severity: required }
      - { field: file.io.read_bytes, operator: present, severity: recommended }
      - { field: file.io.write_bytes, operator: present, severity: recommended }
scoring: { weight: 1.0, required_field_weight: 1.0, recommended_field_weight: 0.25 }
metadata:
  owner: edr-validation-team
  status: active
  change_reason: 增加有效 JSON 子项并将其设为云端必检锚点；TXT 子项保留作产品敏感度对照。
  references: [Tencent EDR FileEvents / FileWriteClose / 打开文件]
