schema_version: "1.0"
profile_id: generic-scheduled-task-activity-v1
vendor: Generic
product: Scheduled Task Activity Self-Test Fixture
description: 用于验证三类 Scheduled Task Activity BASELINE 与比较器的扁平 JSON 适配；不是任何 EDR 厂商的生产映射。

input:
  containers: [json-array, jsonl]
  encoding: utf-8
  record_selector:
    all: { table: ScheduledTaskActivity }
  event_id_field: event_id
  host_id_field: host_id
  event_time: { field: event_time, format: iso8601 }

routes:
  - route_id: scheduled-task-activity
    when: { table: ScheduledTaskActivity }
    canonical:
      "event.type": { constant: scheduled_task }
      "event.action": { source: action }
      "event.category": { constant: configuration }
      "event.id": { source: event_id }
      "event.created": { source: event_time, transform: [parse_datetime_to_utc] }
      "host.id": { source: host_id }
      "host.hostname": { source: host_name }
      "process.pid": { source: actor_pid, on_zero: null }
      "process.name": { source: actor_name, on_empty: null }
      "process.executable": { source: actor_executable, transform: [windows_path], on_empty: null }
      "process.command_line": { source: actor_command_line, on_empty: null }
      "user.name": { source: subject_user_name, on_empty: null }
      "user.domain": { source: subject_domain_name, on_empty: null }
      "user.id": { source: subject_user_sid, on_empty: null }
      "winlog.event_id": { source: event_log_id }
      "scheduled_task.name": { source: task_name }
      "scheduled_task.content": { source: task_content, on_empty: null }

raw_reference: { id_field: event_id, ordinal_base: 0 }
unmapped_fields: { policy: count-and-ignore, preserve_in_report: false }
