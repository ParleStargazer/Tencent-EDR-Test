      "network.source_ip": { source: "Child.SrcIp" }
      "network.source_port": { source: "Child.SrcPort" }
      "network.destination_ip": { source: "Child.DstIp" }
      "network.destination_port": { source: "Child.DstPort" }
      "url.full": { source: "Child.Url" }
      "url.domain": { source: "Child.Host", transform: [lowercase], on_empty: null }
      "http.request.method": { constant: GET }

  - route_id: process-create
    when:
      "Action.Type": Proc
      "Action.Name": ProcessCreate
    canonical:
      "event.type":
        constant: process
      "event.action":
        constant: create
      "event.category":
        constant: process
      "event.id":
        source: "Common.EventUUId"
      "event.created":
        source: "Common.EventTime"
        transform:
          - unix_ms_to_utc
      "event.observed":
        source: "@timestamp"
        transform:
          - parse_datetime_to_utc
        on_error: null
      "host.id":
        source: "Common.Mid"
      "host.hostname":
        source: "Environment.HostName"
      "host.os":
        source: "Environment.OsVersion"
      "host.agent_id":
        source: "Common.Guid"
      "host.agent_version":
        source: "Common.ClientVer"
      "process.pid":
        source: "Child.ProcPid"
      "process.entity_id":
        source: "Child.ProcGuid"
      "process.name":
        source: "Child.FileName"
      "process.executable":
        source: "Child.FilePath"
        transform:
          - windows_path
      "process.command_line":
        source: "Child.ProcCmdline"
      "process.start":
