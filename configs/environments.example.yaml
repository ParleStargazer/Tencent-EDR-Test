schema_version: "1.1"
environments:
  lab:
    labels:
      purpose: edr-validation
      production: "false"
    workspace_root: "C:\\EDRLab"
    max_risk_level: L1

    runner:
      parallelism: 1
      stop_on_sample_error: false
      stop_on_cleanup_error: true
      default_timeout_seconds: 60

    database:
      runs_root: "runs"
      journal_mode: WAL
      busy_timeout_ms: 5000
      checkpoint_on_finalize: true

    local_export:
      directory_name: "export"
      redact:
        - environment.user_name
        - environment.ip_addresses

    cloud_import:
      directory_name: "import"
      mapping_profile: "mappings/tencent-edr-proc-events-v1.yaml"
      accepted_containers:
        - json-array
        - jsonl
      max_bad_records: 0

    comparison:
      default_time_before_seconds: 60
      default_time_after_seconds: 300
      clock_skew_tolerance_seconds: 30
      require_complete_export_for_fail: true
      ambiguity_score_margin: 10

    network:
      allow_loopback: true
      allowed_hosts:
        - "127.0.0.1"
        - "::1"
      allowed_domains:
        - "edr-lab.internal.example"

# 平台不连接腾讯 EDR API，也不需要保存 EDR 账号或密钥。
# 用户将控制台导出的 JSON 放入本轮运行目录的 import/ 后执行离线比较。
